<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="房东记账">
<title>房东记账</title>

<!-- 告诉手机：我是个 App，图标在这几个地方 -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png">

<style>
/* ==========================================================================
   [SECTION: 配色与基础样式]
   颜色统一在这里定义，以后想换配色只改这一块。
   ========================================================================== */
:root{
  --blue:#1f6feb;        /* 主色：按钮、选中状态 */
  --blue-soft:#ddeaff;
  --green:#1a7f37;       /* 已收 */
  --green-soft:#dcfce7;
  --red:#cf222e;         /* 未收 / 未交租 */
  --red-soft:#ffe4e6;
  --amber:#bf8700;       /* 今天该收租 */
  --amber-soft:#fff4d6;
  --gray:#6e7781;        /* 未租 / 空置 */
  --gray-soft:#eef1f4;

  --bg:#f2f4f7;
  --card:#ffffff;
  --line:#e3e7ec;
  --text:#1b1f24;
  --text-dim:#5b6570;

  --radius:14px;
  --shadow:0 1px 3px rgba(16,24,40,.06), 0 1px 2px rgba(16,24,40,.04);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

html,body{margin:0;padding:0;}

body{
  /* 房东不是年轻人：基础字号调大，行高放宽 */
  font-size:17px;
  line-height:1.5;
  color:var(--text);
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",
              "Helvetica Neue",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
}
body.locked{overflow:hidden;}

/* ==========================================================================
   [SECTION: 顶栏]
   ========================================================================== */
.app-bar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:8px;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  background:var(--blue);
  color:#fff;
}
.app-bar h1{
  flex:1;margin:0;
  font-size:20px;font-weight:600;letter-spacing:.5px;
}
.app-bar button{
  min-height:44px;
  border:0;border-radius:22px;
  background:rgba(255,255,255,.18);
  color:#fff;font-size:16px;font-weight:500;
  font-family:inherit;cursor:pointer;
}
.app-bar button:active{background:rgba(255,255,255,.3);}
.app-bar .btn-stat{padding:0 16px;}
.app-bar .btn-gear{padding:0 14px;font-size:19px;}

/* "装到桌面"按钮：只有当手机支持安装时才会出现 */
.app-bar .btn-install{
  padding:0 16px;
  background:#fff;color:var(--blue);
  font-weight:700;
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.6);}
  50%    {box-shadow:0 0 0 8px rgba(255,255,255,0);}
}

/* ==========================================================================
   [SECTION: 第一层标签 —— 区域]
   ========================================================================== */
.tabs-area{
  position:sticky;top:calc(68px + env(safe-area-inset-top));z-index:19;
  display:flex;gap:8px;
  padding:10px 16px;
  overflow-x:auto;
  background:var(--card);
  border-bottom:1px solid var(--line);
  scrollbar-width:none;
}
.tabs-area::-webkit-scrollbar{display:none;}

.tab-area{
  flex:0 0 auto;
  min-height:40px;padding:0 18px;
  display:flex;align-items:center;
  border:1px solid var(--line);
  border-radius:20px;
  background:#fff;
  color:var(--text-dim);
  font-size:16px;font-family:inherit;
  white-space:nowrap;cursor:pointer;
  transition:background .15s,border-color .15s,color .15s;
}
.tab-area[aria-selected="true"]{
  background:var(--blue-soft);
  border-color:var(--blue);
  color:var(--blue);
  font-weight:600;
}
.tab-area.add{
  border-style:dashed;
  color:var(--blue);
  border-color:#b9d0f5;
}

/* ==========================================================================
   [SECTION: 第二层标签 —— 状态]
   ========================================================================== */
.tabs-status{
  position:sticky;top:calc(119px + env(safe-area-inset-top));z-index:18;
  display:flex;
  background:var(--card);
  border-bottom:1px solid var(--line);
}
.tab-status{
  flex:1;
  min-height:52px;
  display:flex;align-items:center;justify-content:center;gap:5px;
  border:0;background:none;
  color:var(--text-dim);
  font-size:16px;font-family:inherit;
  cursor:pointer;
  border-bottom:3px solid transparent;
  transition:color .15s,border-color .15s;
}
.tab-status[aria-selected="true"]{
  color:var(--blue);
  font-weight:600;
  border-bottom-color:var(--blue);
}
.tab-status .cnt{
  min-width:20px;height:20px;padding:0 6px;
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:10px;
  background:var(--red);color:#fff;
  font-size:13px;font-weight:600;
}

/* ==========================================================================
   [SECTION: 房间列表]
   ========================================================================== */
.room-list{
  padding:14px 16px 8px;
  display:flex;flex-direction:column;gap:12px;
}

.room-card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:16px;
  cursor:pointer;
}
.room-card:active{background:#fafbfc;}

.room-top{
  display:flex;align-items:center;gap:10px;
  margin-bottom:8px;
}
.room-no{
  font-size:22px;font-weight:700;letter-spacing:.5px;
}
.room-tags{margin-left:auto;display:flex;gap:6px;}

.tag{
  padding:3px 10px;border-radius:12px;
  font-size:14px;font-weight:600;white-space:nowrap;
}
.tag.rented  {background:var(--blue-soft); color:var(--blue);}
.tag.vacant  {background:var(--gray-soft); color:var(--gray);}
.tag.paid    {background:var(--green-soft);color:var(--green);}
.tag.unpaid  {background:var(--red-soft);  color:var(--red);}
.tag.duetoday{background:var(--amber-soft);color:var(--amber);}

.room-line{
  display:flex;align-items:baseline;gap:8px;
  color:var(--text-dim);font-size:16px;
}
.room-line + .room-line{margin-top:4px;}
.room-line .k{color:var(--text);font-weight:500;}
.room-line .phone{margin-left:auto;color:var(--blue);text-decoration:none;}
.room-line .money{color:var(--text);font-weight:600;font-size:17px;}
.room-line .money small{font-weight:400;font-size:14px;color:var(--text-dim);}

.room-act{margin-top:14px;}
.btn-act{
  width:100%;min-height:46px;
  border:0;border-radius:10px;
  background:var(--blue);color:#fff;
  font-size:17px;font-weight:600;font-family:inherit;
  cursor:pointer;
}
.btn-act:active{opacity:.85;}
.btn-act.ghost{
  background:#fff;color:var(--blue);
  border:1.5px solid var(--blue);
}

/* 列表底部的"添加房间" */
.btn-add-room{
  width:100%;min-height:52px;
  margin-top:2px;
  border:1.5px dashed #b9d0f5;
  border-radius:var(--radius);
  background:#fff;color:var(--blue);
  font-size:17px;font-weight:600;font-family:inherit;
  cursor:pointer;
}
.btn-add-room:active{background:var(--blue-soft);}

/* 空状态 */
.empty{
  margin:24px 0;
  padding:40px 24px;
  text-align:center;
  color:var(--text-dim);
  background:var(--card);
  border-radius:var(--radius);
}
.empty .big{font-size:40px;margin-bottom:10px;}
.empty .btn-act{max-width:220px;margin:18px auto 0;}

/* ==========================================================================
   [SECTION: 提示条]
   ========================================================================== */
.notice{
  margin:16px;
  padding:12px 16px;
  background:var(--amber-soft);
  border-radius:10px;
  color:#7a5800;
  font-size:15px;
  line-height:1.6;
}
.notice.info{background:var(--blue-soft);color:#0b4ba8;}

/* ==========================================================================
   [SECTION: 全局提示气泡]
   ========================================================================== */
.toast{
  position:fixed;left:50%;bottom:calc(32px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(20px);
  max-width:82vw;padding:12px 20px;
  background:rgba(27,31,36,.9);color:#fff;
  border-radius:22px;font-size:16px;text-align:center;
  opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;
  z-index:99;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ==========================================================================
   [SECTION: 新版本提示条]
   发现有新版本时从顶部滑下来。绝不自动刷新——房东可能正在填房间信息，
   突然刷新等于把他填了一半的东西弄丢。
   ========================================================================== */
.update-bar{
  position:fixed;left:0;right:0;top:0;z-index:60;
  display:none;align-items:center;gap:12px;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  background:#1a7f37;color:#fff;
  font-size:16px;
  box-shadow:0 2px 10px rgba(0,0,0,.18);
}
.update-bar.show{display:flex;}
.update-bar span{flex:1;}
.update-bar button{
  min-height:40px;padding:0 16px;
  border:0;border-radius:20px;
  background:#fff;color:#1a7f37;
  font-size:16px;font-weight:600;font-family:inherit;
  cursor:pointer;white-space:nowrap;
}

/* ==========================================================================
   [SECTION: 从底部滑上来的表单面板]
   ========================================================================== */
.sheet-mask{
  position:fixed;inset:0;z-index:70;
  background:rgba(16,24,40,.45);
  opacity:0;pointer-events:none;
  transition:opacity .2s;
}
.sheet-mask.show{opacity:1;pointer-events:auto;}

.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:71;
  max-height:88vh;
  display:flex;flex-direction:column;
  background:var(--card);
  border-radius:18px 18px 0 0;
  transform:translateY(102%);
  transition:transform .25s cubic-bezier(.2,.8,.3,1);
  box-shadow:0 -4px 24px rgba(16,24,40,.16);
}
.sheet.show{transform:translateY(0);}

.sheet-head{
  display:flex;align-items:center;gap:8px;
  padding:14px 12px;
  border-bottom:1px solid var(--line);
  flex:0 0 auto;
}
.sheet-head h2{
  flex:1;margin:0;text-align:center;
  font-size:18px;font-weight:600;
}
.sheet-head button{
  min-height:44px;padding:0 12px;
  border:0;background:none;
  font-size:17px;font-family:inherit;cursor:pointer;
  color:var(--text-dim);
}
.sheet-head button.primary{color:var(--blue);font-weight:600;}
.sheet-head button:disabled{opacity:.4;}

.sheet-body{
  padding:8px 16px calc(24px + env(safe-area-inset-bottom));
  overflow-y:auto;
  flex:1 1 auto;
}
.sheet-note{
  padding:12px 16px;
  color:var(--text-dim);
  font-size:15px;
  line-height:1.7;
}

/* ==========================================================================
   [SECTION: 表单]
   ========================================================================== */
.field{
  padding:14px 0;
  border-bottom:1px solid var(--line);
}
.field:last-child{border-bottom:0;}

.field label{
  display:block;
  margin-bottom:6px;
  color:var(--text-dim);
  font-size:15px;
}
.field .hint{
  margin-top:6px;
  color:var(--text-dim);
  font-size:14px;
  line-height:1.6;
}
.field input[type=text],
.field input[type=tel],
.field input[type=number],
.field input[type=date]{
  width:100%;
  min-height:48px;
  padding:0 14px;
  border:1.5px solid var(--line);
  border-radius:10px;
  background:#fff;
  color:var(--text);
  font-size:17px;
  font-family:inherit;
}
.field input:focus{
  outline:none;
  border-color:var(--blue);
}
.field .with-unit{
  display:flex;align-items:center;gap:10px;
}
.field .with-unit input{flex:1;}
.field .unit{color:var(--text-dim);font-size:16px;white-space:nowrap;}

/* 横向排列的小按钮组（如"用房间的 / 用默认的"） */
.seg{
  display:flex;gap:8px;
}
.seg button{
  flex:1;min-height:46px;
  border:1.5px solid var(--line);
  border-radius:10px;
  background:#fff;color:var(--text-dim);
  font-size:16px;font-family:inherit;cursor:pointer;
}
.seg button[aria-pressed="true"]{
  border-color:var(--blue);background:var(--blue-soft);
  color:var(--blue);font-weight:600;
}

/* 管理列表里的一行 */
.list-row{
  display:flex;align-items:center;gap:10px;
  padding:14px 0;
  border-bottom:1px solid var(--line);
}
.list-row:last-child{border-bottom:0;}
.list-row .name{flex:1;font-size:17px;}
.list-row .sub{color:var(--text-dim);font-size:14px;}
.icon-btn{
  min-width:44px;min-height:44px;
  border:1.5px solid var(--line);
  border-radius:10px;
  background:#fff;color:var(--text-dim);
  font-size:15px;font-family:inherit;cursor:pointer;
}
.icon-btn.danger{color:var(--red);border-color:#f5c2c7;}
.icon-btn:disabled{opacity:.35;}

/* 危险按钮（删除） */
.btn-danger{
  width:100%;min-height:48px;
  margin-top:8px;
  border:1.5px solid #f5c2c7;
  border-radius:10px;
  background:#fff;color:var(--red);
  font-size:17px;font-weight:600;font-family:inherit;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- 发现新版本时出现的提示条（默认隐藏） -->
<div class="update-bar" id="updateBar">
  <span>有新版本了</span>
  <button id="btnUpdate">立即更新</button>
</div>

<header class="app-bar">
  <h1>房东记账</h1>
  <button class="btn-install" id="btnInstall" hidden>装到桌面</button>
  <button class="btn-stat" id="btnStat">统计</button>
  <button class="btn-gear" id="btnGear" aria-label="设置">⚙</button>
</header>

<!-- 第一层：区域 -->
<nav class="tabs-area" id="tabsArea" role="tablist" aria-label="区域"></nav>

<!-- 第二层：状态 -->
<nav class="tabs-status" id="tabsStatus" role="tablist" aria-label="状态"></nav>

<!-- 房间列表 -->
<main class="room-list" id="roomList"></main>

<div class="notice info" id="notice"></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- 从底部滑上来的表单面板 -->
<div class="sheet-mask" id="sheetMask"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-head">
    <button id="sheetCancel">取消</button>
    <h2 id="sheetTitle"></h2>
    <button id="sheetOk" class="primary">保存</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<!-- 算账的大脑：纯计算，可被自动测试 -->
<script src="./calc.js"></script>

<script>
/* ==========================================================================
   [SECTION: 数据库层]
   --------------------------------------------------------------------------
   五本"账本"：areas（区域） rooms（房间） tenancies（租约）
              payments（收款记录） meta（设置）

   ⚠️ 改这里之前先读 CLAUDE.md 第 13 章。两条不能破的规矩：
     1. switch 里故意不写 break —— 保证任何旧版本都能升到最新
     2. 永远不删表、永远不给已有的表改主键（IndexedDB 不支持，改了会丢数据）
   ========================================================================== */

const DB_NAME = 'lz_rent_db';
const DB_VERSION = 1;

function openDB() {
  return new Promise((resolve, reject) => {
    let req;
    try { req = indexedDB.open(DB_NAME, DB_VERSION); }
    catch (err) { reject(err); return; }

    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      // 任何异常都不能让它抛出去 —— 否则数据库会卡在旧版本打不开
      try {
        switch (e.oldVersion) {          // ⚠️ 故意不写 break，级联穿透
          case 0: {
            db.createObjectStore('areas', { keyPath: 'id' })
              .createIndex('order', 'order');

            db.createObjectStore('rooms', { keyPath: 'id' })
              .createIndex('areaId', 'areaId');

            db.createObjectStore('tenancies', { keyPath: 'id' })
              .createIndex('roomId', 'roomId');

            const pay = db.createObjectStore('payments', { keyPath: 'id' });
            pay.createIndex('roomId', 'roomId');
            pay.createIndex('room_month', ['roomId', 'month']);

            db.createObjectStore('meta', { keyPath: 'key' });
            break;
          }
          // 将来加表写在这里，例如：
          // case 1: { db.createObjectStore('adjustments', { keyPath:'id' }); }
        }
      } catch (err) {
        console.error('[数据库] 升级时出错，已忽略以免卡死：', err);
      }
    };

    req.onsuccess = () => resolve(req.result);
    req.onerror   = () => reject(req.error);
    req.onblocked = () => reject(new Error('数据库被其他页面占用，请关掉其他标签页重试'));
  });
}

let db = null;

/** 把一次数据库操作包成 Promise，并统一处理出错 */
function tx(storeName, mode) {
  return db.transaction(storeName, mode).objectStore(storeName);
}

function req2p(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror   = () => reject(request.error);
  });
}

const dbGetAll = (store) => req2p(tx(store, 'readonly').getAll());
const dbGet    = (store, key) => req2p(tx(store, 'readonly').get(key));
const dbPut    = (store, value) => req2p(tx(store, 'readwrite').put(value));
const dbDel    = (store, key) => req2p(tx(store, 'readwrite').delete(key));

/** 一批写入放在同一个事务里 —— 要么全成功，要么全失败，不会写一半 */
function dbPutAll(store, list) {
  if (!list.length) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const t = db.transaction(store, 'readwrite');
    const os = t.objectStore(store);
    for (const item of list) os.put(item);
    t.oncomplete = () => resolve();
    t.onerror    = () => reject(t.error);
    t.onabort    = () => reject(t.error || new Error('写入被中断'));
  });
}

/* ---------- 生成不会重复的编号 ---------- */
function newId(prefix) {
  if (crypto && crypto.randomUUID) return prefix + '_' + crypto.randomUUID();
  // 老浏览器兜底
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}

/* ==========================================================================
   [SECTION: 内存里的数据]
   启动时一次读进内存，之后界面都从内存渲染。
   写库成功后立刻更新内存并重渲染 —— 绝不允许"界面先变了、写库却失败"。
   ========================================================================== */

const state = {
  areas: [],
  rooms: [],
  tenancies: [],
  payments: [],
  settings: {
    defaultRentDueDay: 5,
    statsStartMonth: '',
    lastBackupAt: 0,
  },
  loaded: false,
};

let curArea = null;     // 当前选中的区域 id
let curStatus = 'all';  // 当前选中的状态

/** 从数据库读全部数据到内存 */
async function loadAll() {
  const [areas, rooms, tenancies, payments] = await Promise.all([
    dbGetAll('areas'), dbGetAll('rooms'),
    dbGetAll('tenancies'), dbGetAll('payments'),
  ]);

  state.areas     = areas.filter(a => !a.isDeleted).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  state.rooms     = rooms.filter(r => !r.isDeleted);
  state.tenancies = tenancies.filter(t => !t.isDeleted);
  state.payments  = payments;

  // 设置项
  const metas = await dbGetAll('meta');
  for (const m of metas) {
    if (m.key in state.settings) state.settings[m.key] = m.value;
  }

  state.loaded = true;

  // 当前选中的区域如果没了（刚被删），自动切到第一个
  if (!state.areas.some(a => a.id === curArea)) {
    curArea = state.areas.length ? state.areas[0].id : null;
  }
}

async function saveSetting(key, value) {
  state.settings[key] = value;
  await dbPut('meta', { key, value });
}

/* ==========================================================================
   [SECTION: 取出某间房的租约 / 收款]
   ========================================================================== */

const tenanciesOf = (roomId) => state.tenancies.filter(t => t.roomId === roomId);
const paymentsOf  = (roomId) => state.payments.filter(p => p.roomId === roomId);

/** 这间房现在租出去了吗（有没有一份租约覆盖今天） */
function isRentedNow(room) {
  const today = todayStr();
  return tenanciesOf(room.id).some(t => leaseCoversDay(t, today));
}

/** 这间房这个月收到钱了没有 */
function isPaidInMonth(roomId, ym) {
  return paymentsOf(roomId).some(p => p.month === ym);
}

/** 这间房每个月的状态 */
function monthStateOf(room, ym) {
  return roomMonthState({
    tenancies: tenanciesOf(room.id),
    hasPayment: isPaidInMonth(room.id, ym),
    room,
    ym,
    today: todayStr(),
    defaults: { rentDueDay: state.settings.defaultRentDueDay },
  });
}

/* ==========================================================================
   [SECTION: 界面小组件 —— 提示气泡 / 表单面板]
   ========================================================================== */

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

let sheetOnOk = null;
let sheetOnClose = null;

/**
 * 打开底部面板
 * @param title    标题
 * @param bodyHtml 表单内容
 * @param onOk     点"保存"时调用，返回 false 表示校验没过、不要关闭
 */
function openSheet({ title, bodyHtml, onOk, okText = '保存', showOk = true }) {
  document.getElementById('sheetTitle').textContent = title;
  document.getElementById('sheetCancel').textContent = showOk ? '取消' : '关闭';

  // 把 sheetBody 整个换成一个干净的新元素。
  // 这样上一次挂在上面的点击事件会随着旧元素一起消失，
  // 反复打开同一个面板也不会让事件越堆越多（堆多了会一次触发好几次）。
  const old = document.getElementById('sheetBody');
  const fresh = old.cloneNode(false);   // cloneNode(false) 不复制子节点，也不复制事件
  fresh.id = 'sheetBody';
  old.parentNode.replaceChild(fresh, old);
  fresh.innerHTML = bodyHtml;

  const okBtn = document.getElementById('sheetOk');
  okBtn.textContent = okText;
  okBtn.hidden = !showOk;
  okBtn.disabled = false;
  sheetOnOk = onOk || null;
  sheetOnClose = null;

  document.getElementById('sheetMask').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  document.body.classList.add('locked');
}

function closeSheet() {
  document.getElementById('sheetMask').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
  document.body.classList.remove('locked');
  const cb = sheetOnClose;
  sheetOnOk = null;
  sheetOnClose = null;
  if (cb) cb();
}

document.getElementById('sheetCancel').addEventListener('click', closeSheet);
document.getElementById('sheetMask').addEventListener('click', closeSheet);

document.getElementById('sheetOk').addEventListener('click', async () => {
  if (!sheetOnOk) return closeSheet();
  const btn = document.getElementById('sheetOk');
  btn.disabled = true;
  try {
    const r = await sheetOnOk();
    if (r !== false) closeSheet();
  } catch (err) {
    console.error(err);
    toast('操作失败，数据没有改变');
  } finally {
    btn.disabled = false;
  }
});

/** 问一句"确定吗"，用户点了确定才继续。返回 true / false */
function confirmSheet({ title, message, okText = '确定' }) {
  return new Promise((resolve) => {
    let done = false;
    openSheet({
      title,
      bodyHtml: `<div class="sheet-note">${message}</div>`,
      okText,
      onOk: () => { done = true; resolve(true); return true; },
    });
    // 面板被关掉（点了取消 / 点了遮罩）也算答复 = 不要删
    sheetOnClose = () => { if (!done) resolve(false); };
  });
}

/* ==========================================================================
   [SECTION: 表单字段生成]
   ========================================================================== */

const esc = (s) => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const attr = (s) => esc(s).replace(/\n/g, ' ');

function fText(id, label, value, { placeholder = '', hint = '', type = 'text', inputmode = '' } = {}) {
  return `<div class="field">
    <label for="${id}">${esc(label)}</label>
    <input id="${id}" type="${type}" ${inputmode ? `inputmode="${inputmode}"` : ''}
           value="${attr(value)}" placeholder="${attr(placeholder)}">
    ${hint ? `<div class="hint">${hint}</div>` : ''}
  </div>`;
}

function fMoney(id, label, value, { hint = '' } = {}) {
  return `<div class="field">
    <label for="${id}">${esc(label)}</label>
    <div class="with-unit">
      <input id="${id}" type="number" inputmode="decimal" min="0" step="0.01"
             value="${value === '' || value == null ? '' : attr(value)}" placeholder="0">
      <span class="unit">元</span>
    </div>
    ${hint ? `<div class="hint">${hint}</div>` : ''}
  </div>`;
}

function fDate(id, label, value, { hint = '' } = {}) {
  return `<div class="field">
    <label for="${id}">${esc(label)}</label>
    <input id="${id}" type="date" value="${attr(value)}">
    ${hint ? `<div class="hint">${hint}</div>` : ''}
  </div>`;
}

/** 读表单里的值，去掉首尾空格 */
const val = (id) => (document.getElementById(id)?.value ?? '').trim();

/** 读金额，空字符串当 0 */
const valMoney = (id) => {
  const v = val(id);
  if (v === '') return 0;
  const n = Number(v);
  return isFinite(n) && n >= 0 ? n : NaN;
};

   [SECTION: 区域相关操作]
   ========================================================================== */

async function createArea(name) {
  const area = {
    id: newId('a'),
    name,
    order: state.areas.length ? Math.max(...state.areas.map(a => a.order ?? 0)) + 1 : 1,
    rentDueDay: null,
    isDeleted: false,
    createdAt: Date.now(),
    updatedAt: Date.now(),
  };
  await dbPut('areas', area);
  state.areas.push(area);
  curArea = area.id;
  renderAll();
}

async function renameArea(area, name) {
  const next = { ...area, name, updatedAt: Date.now() };
  await dbPut('areas', next);
  Object.assign(area, next);
  renderAll();
}

async function deleteArea(area) {
  const rooms = state.rooms.filter(r => r.areaId === area.id);
  const next = { ...area, isDeleted: true, updatedAt: Date.now() };
  await dbPut('areas', next);

  // 区域删了，底下的房间也一起收进回收站（不是真删，以后能救回来）
  if (rooms.length) {
    await dbPutAll('rooms', rooms.map(r => ({ ...r, isDeleted: true, updatedAt: Date.now() })));
    const ids = new Set(rooms.map(r => r.id));
    state.rooms = state.rooms.filter(r => !ids.has(r.id));
  }
  state.areas = state.areas.filter(a => a.id !== area.id);

  if (curArea === area.id) curArea = state.areas.length ? state.areas[0].id : null;
  renderAll();
}

async function moveArea(area, dir) {
  const i = state.areas.findIndex(a => a.id === area.id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= state.areas.length) return;

  const a = state.areas[i], b = state.areas[j];
  const ao = a.order ?? i, bo = b.order ?? j;
  await dbPutAll('areas', [
    { ...a, order: bo, updatedAt: Date.now() },
    { ...b, order: ao, updatedAt: Date.now() },
  ]);
  state.areas[i] = { ...b, order: ao };
  state.areas[j] = { ...a, order: bo };
  state.areas.sort((x, y) => (x.order ?? 0) - (y.order ?? 0));
  renderAll();
}

async function createRoom(data) {
  const room = {
    id: newId('r'),
    areaId: data.areaId,
    no: data.no,
    rent: data.rent,
    rentDueDay: data.rentDueDay,     // null = 用全局默认
    deposit: data.deposit,
    isDeleted: false,
    createdAt: Date.now(),
    updatedAt: Date.now(),
  };
  await dbPut('rooms', room);
  state.rooms.push(room);
  renderAll();
  return room;
}

async function updateRoom(room, patch) {
  const next = { ...room, ...patch, updatedAt: Date.now() };
  await dbPut('rooms', next);
  Object.assign(room, next);
  renderAll();
}

async function deleteRoom(room) {
  const next = { ...room, isDeleted: true, updatedAt: Date.now() };
  await dbPut('rooms', next);
  state.rooms = state.rooms.filter(r => r.id !== room.id);
  renderAll();
}

const roomsOfArea = (areaId) => state.rooms.filter(r => r.areaId === areaId);

   ========================================================================== */

const STATUS_TABS = [
  { key: 'all',    label: '全部'   },
  { key: 'rented', label: '已租'   },
  { key: 'vacant', label: '未租'   },
  { key: 'unpaid', label: '未交租' },
];

const thisMonth = () => currentMonth();

/** 判断一间房符不符合某个状态 */
function matchStatus(room, key) {
  if (key === 'all')    return true;
  const rented = isRentedNow(room);
  if (key === 'rented') return rented;
  if (key === 'vacant') return !rented;
  if (key === 'unpaid') return monthStateOf(room, thisMonth()) === 'overdue';
  return true;
}

function visibleRooms() {
  if (!curArea) return [];
  return roomsOfArea(curArea).filter(r => matchStatus(r, curStatus));
}

function countOf(key) {
  if (!curArea) return 0;
  return roomsOfArea(curArea).filter(r => matchStatus(r, key)).length;
}

function renderAreaTabs() {
  const el = document.getElementById('tabsArea');
  if (!state.areas.length) { el.innerHTML = ''; return; }
  el.innerHTML = state.areas.map(a =>
    `<button class="tab-area" role="tab" data-area="${attr(a.id)}"
             aria-selected="${a.id === curArea}">${esc(a.name)}</button>`
  ).join('') + `<button class="tab-area add" data-add="1">＋ 区域</button>`;
}

function renderStatusTabs() {
  const el = document.getElementById('tabsStatus');
  if (!state.areas.length) { el.innerHTML = ''; return; }
  el.innerHTML = STATUS_TABS.map(t => {
    const n = t.key === 'unpaid' ? countOf('unpaid') : 0;
    return `<button class="tab-status" role="tab" data-status="${t.key}"
                    aria-selected="${t.key === curStatus}">
              ${t.label}${n ? `<span class="cnt">${n}</span>` : ''}
            </button>`;
  }).join('');
}

function renderRooms() {
  const el = document.getElementById('roomList');

  // 一个区域都没有 → 第一次使用
  if (!state.areas.length) {
    el.innerHTML = `<div class="empty">
        <div class="big">🏠</div>
        <div>还没有区域</div>
        <div style="margin-top:8px;font-size:15px">
          先建一个区域，比如「城东小区3栋」「老房子」
        </div>
        <button class="btn-act" data-act="newArea">＋ 新建区域</button>
      </div>`;
    return;
  }

  const list = visibleRooms();

  if (!list.length) {
    el.innerHTML = `<div class="empty">
        <div class="big">🔍</div>
        <div>这里还没有房间</div>
        <button class="btn-act ghost" data-act="newRoom">＋ 添加房间</button>
      </div>`;
    return;
  }

  const ym = thisMonth();

  el.innerHTML = list.map(r => {
    const rented = isRentedNow(r);
    const st = monthStateOf(r, ym);
    const tenant = rented
      ? tenantOfMonth(tenanciesOf(r.id), ym)
      : { name: '', phone: '' };

    // —— 状态标签 ——
    let tags = rented
      ? `<span class="tag rented">已租</span>`
      : `<span class="tag vacant">未租</span>`;

    if (rented) {
      if (st === 'paid')     tags += `<span class="tag paid">✓ 已收</span>`;
      if (st === 'overdue')  tags += `<span class="tag unpaid">⚠ 未收</span>`;
      if (st === 'dueToday') tags += `<span class="tag duetoday">今天该收租</span>`;
    }

    // —— 第二行：租客 / 空置 ——
    const line2 = tenant.name
      ? `<div class="room-line">
           <span class="k">${esc(tenant.name)}</span>
           ${tenant.phone ? `<a class="phone" href="tel:${attr(tenant.phone.replace(/\s/g,''))}"
              data-act="noop">${esc(tenant.phone)}</a>` : ''}
         </div>`
      : `<div class="room-line"><span>${rented ? '已租' : '暂时没人住'}</span></div>`;

    // —— 第三行：租金 / 租期 ——
    const t = activeLeaseInMonth(tenanciesOf(r.id), ym);
    const rentLine = `<div class="room-line">
        <span class="money">${fmtYuan(r.rent)}<small>/月</small></span>
        ${t && t.startDate ? `<span>租期 ${esc(t.startDate)} 起</span>` : ''}
      </div>`;

    // —— 按钮 ——
    const btn = rented
      ? (st === 'paid'
          ? `<button class="btn-act ghost" data-act="pay" data-room="${attr(r.id)}">已收 · 点击可撤销</button>`
          : `<button class="btn-act" data-act="pay" data-room="${attr(r.id)}">确认已收</button>`)
      : `<button class="btn-act ghost" data-act="rent" data-room="${attr(r.id)}">登记租客</button>`;

    return `<article class="room-card" data-act="edit" data-room="${attr(r.id)}">
              <div class="room-top">
                <span class="room-no">${esc(r.no)}</span>
                <span class="room-tags">${tags}</span>
              </div>
              ${line2}
              ${rentLine}
              <div class="room-act">${btn}</div>
            </article>`;
  }).join('') + `<button class="btn-add-room" data-act="newRoom">＋ 添加房间</button>`;
}

function renderNotice() {
  const el = document.getElementById('notice');

  if (!state.areas.length) { el.style.display = 'none'; return; }
  el.style.display = '';

  const n = state.rooms.length;
  el.className = 'notice info';
  el.innerHTML = n
    ? `已保存 <b>${n}</b> 间房。数据存在这台手机里，刷新、关掉 App 都不会丢。`
    : `区域已建好，接下来点「＋ 添加房间」把房间加进去。`;
}

function renderAll() {
  renderAreaTabs();
  renderStatusTabs();
  renderRooms();
  renderNotice();
}

function sheetNewArea() {
  openSheet({
    title: '新建区域',
    bodyHtml:
      fText('aName', '区域名称', '', {
        placeholder: '例如：城东小区3栋',
        hint: '一个区域 = 一栋楼、一个小区、或一处房产。<br>建好之后，可以在里面加房间。',
      }) +
      fText('aDue', '每月几号收租（可留空）', '', {
        type: 'number', inputmode: 'numeric',
        placeholder: String(state.settings.defaultRentDueDay),
        hint: '留空就用默认的每月 ' + state.settings.defaultRentDueDay + ' 号。<br>这里设了，这个区域里所有房间都用这个日子。',
      }),
    onOk: async () => {
      const name = val('aName');
      if (!name) { toast('请填区域名称'); return false; }

      const dueRaw = val('aDue');
      let due = null;
      if (dueRaw !== '') {
        due = Number(dueRaw);
        if (!Number.isInteger(due) || due < 1 || due > 31) {
          toast('收租日请填 1~31 之间的整数'); return false;
        }
      }

      const area = {
        id: newId('a'),
        name,
        order: state.areas.length ? Math.max(...state.areas.map(a => a.order ?? 0)) + 1 : 1,
        rentDueDay: due,
        isDeleted: false,
        createdAt: Date.now(),
        updatedAt: Date.now(),
      };
      await dbPut('areas', area);
      state.areas.push(area);
      curArea = area.id;
      curStatus = 'all';
      renderAll();
      toast('区域建好了');
      return true;
    },

}

function sheetManageAreas() {
  const rows = state.areas.map((a, i) => {
    const n = roomsOfArea(a.id).length;
    return `<div class="list-row">
      <div style="flex:1">
        <div class="name">${esc(a.name)}</div>
        <div class="sub">${n} 间房${a.rentDueDay ? ` · ${a.rentDueDay}号收租` : ''}</div>
      </div>
      <button class="icon-btn" data-mv="${attr(a.id)}" data-dir="-1"
              ${i === 0 ? 'disabled' : ''}>↑</button>
      <button class="icon-btn" data-mv="${attr(a.id)}" data-dir="1"
              ${i === state.areas.length - 1 ? 'disabled' : ''}>↓</button>
      <button class="icon-btn" data-rn="${attr(a.id)}">改名</button>
      <button class="icon-btn danger" data-rm="${attr(a.id)}">删除</button>
    </div>`;
  }).join('');

  openSheet({
    title: '管理区域',
    showOk: false,
    bodyHtml: rows || '<div class="sheet-note">还没有区域</div>',
  });

  document.getElementById('sheetBody').addEventListener('click', async (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const id = btn.dataset.mv || btn.dataset.rn || btn.dataset.rm;
    const area = state.areas.find(a => a.id === id);
    if (!area) return;

    if (btn.dataset.mv) {
      await moveArea(area, Number(btn.dataset.dir));

      closeSheet();
      sheetRenameArea(area);

      closeSheet();
      sheetDeleteArea(area);

      </div>`,

      if (roomsOfArea(room.areaId).some(r => r.no === no && r.id !== room.id)) {
        toast(`这个区域里已经有「${no}」了`);
        return false;
      }
      const rent = valMoney('rRent');
      if (Number.isNaN(rent)) { toast('租金请填数字'); return false; }
      const deposit = valMoney('rDeposit');
      if (Number.isNaN(deposit)) { toast('押金请填数字'); return false; }

      const dueRaw = val('rDue');
      let due = null;
      if (dueRaw !== '') {
        due = Number(dueRaw);
        if (!Number.isInteger(due) || due < 1 || due > 31) {
          toast('收租日请填 1~31 之间的整数'); return false;
        }
      }

      await updateRoom(room, { no, rent, deposit, rentDueDay: due });
      toast('保存好了');
      return true;
    },
  });

  document.getElementById('doDelRoom').addEventListener('click', async () => {
    closeSheet();
    const yes = await confirmSheet({
      title: '删除房间',
      message: `确定删除「${esc(room.no)}」吗？<br><br>
        删除后会先放进回收站，以后还能找回来。`,
      okText: '确定删除',
    });
    if (yes) { await deleteRoom(room); toast('已收进回收站'); }
  }, { once: true });
}

/* ==========================================================================
   [SECTION: 设置]
   ========================================================================== */

function sheetSettings() {
  openSheet({
    title: '设置',
    showOk: false,
    bodyHtml: `
      <div class="field">
        <label>默认收租日</label>
        <div class="with-unit">
          <input id="sDue" type="number" inputmode="numeric" min="1" max="31"
                 value="${attr(state.settings.defaultRentDueDay)}">
          <span class="unit">号</span>
        </div>
        <div class="hint">
          没单独设置过的房间，都用这个日子。<br>
          如果设了 31 号，遇到只有 30 天的月份会自动提前到月底（2 月同理）。
        </div>
      </div>

      <div class="field">
        <label>管理区域</label>
        <div class="hint" style="margin-bottom:10px">
          当前有 ${state.areas.length} 个区域、${state.rooms.length} 间房。
        </div>
        <button class="btn-act ghost" id="btnManageAreas">管理区域（改名 / 排序 / 删除）</button>
      </div>

      <div class="field">
        <label>数据存在哪</label>
        <div class="hint">
          全部存在这台手机的浏览器里，不会上传到任何地方。<br>
          <b>换手机或清理浏览器数据前，一定要先导出备份</b>（备份功能会在第 9 步做好）。
        </div>
      </div>

      <div class="sheet-note" style="padding-left:0;padding-right:0;color:var(--text-dim)">
        当前进度：第 3 步（数据能存住了）。<br>
        接下来还有：批量建房、租客与收租、统计、备份。
      </div>`,
  });

  document.getElementById('sDue').addEventListener('change', async (e) => {
    let n = Number(e.target.value);
    if (!Number.isInteger(n) || n < 1 || n > 31) {
      toast('请填 1~31 之间的整数');
      e.target.value = state.settings.defaultRentDueDay;
      return;
    }
    await saveSetting('defaultRentDueDay', n);
    renderAll();
    toast('默认收租日改成 ' + n + ' 号了');
  });

  document.getElementById('btnManageAreas').addEventListener('click', () => {
    closeSheet();
    sheetManageAreas();
  }, { once: true });
}

/* ==========================================================================
   [SECTION: 点击交互]
   ========================================================================== */

document.getElementById('tabsArea').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  if (btn.dataset.add) { sheetNewArea(); return; }
  if (btn.dataset.area === curArea) return;
  curArea = btn.dataset.area;
  curStatus = 'all';
  renderAll();
});

document.getElementById('tabsStatus').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn || btn.dataset.status === curStatus) return;
  curStatus = btn.dataset.status;
  renderStatusTabs();
  renderRooms();
});

document.getElementById('roomList').addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  if (act === 'noop') return;              // 电话号码链接，交给系统拨号
  e.stopPropagation();

  const room = el.dataset.room
    ? state.rooms.find(r => r.id === el.dataset.room)
    : null;

  if (act === 'newArea') { sheetNewArea(); return; }
  if (act === 'newRoom') { sheetNewRoom(); return; }
  if (act === 'edit' && room) { sheetEditRoom(room); return; }

  if (act === 'pay' || act === 'rent') {
    toast(act === 'pay'
      ? '确认收租会在第 6 步做好'
      : '登记租客会在第 6 步做好');
  }
});

document.getElementById('btnStat').addEventListener('click', () => {
  toast('统计页会在第 8 步做好');
});

document.getElementById('btnGear').addEventListener('click', sheetSettings);

/* ==========================================================================
   [SECTION: 装到桌面]
   手机认为"这个网站可以装成 App"时，会悄悄告诉我们一声。
   我们趁机把"装到桌面"按钮显示出来，让房东一点就能装。
   ========================================================================== */
let installEvent = null;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();            // 先拦下手机自带的弹窗，我们自己决定什么时候弹
  installEvent = e;
  const btn = document.getElementById('btnInstall');
  if (btn) btn.hidden = false;
});

document.getElementById('btnInstall').addEventListener('click', async () => {
  if (!installEvent) return;
  installEvent.prompt();
  const { outcome } = await installEvent.userChoice;
  if (outcome === 'accepted') {
    document.getElementById('btnInstall').hidden = true;
    toast('装好了，去桌面找「房东记账」');
  }
  installEvent = null;
});

if (window.matchMedia('(display-mode: standalone)').matches) {
  document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('btnInstall');
    if (btn) btn.hidden = true;
  });
}

/* ==========================================================================
   [SECTION: 离线支持 + 新版本提示]
   ========================================================================== */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('./sw.js');
      reg.update();   // 每次打开都问一下有没有新版本

      // 情况一：上次打开时已经下载好新版本了，只是还没换上
      if (reg.waiting && navigator.serviceWorker.controller) showUpdateBar(reg.waiting);

      // 情况二：这次打开时正好发现新版本
      reg.addEventListener('updatefound', () => {
        const sw = reg.installing;
        if (!sw) return;
        sw.addEventListener('statechange', () => {
          if (sw.state === 'installed' && navigator.serviceWorker.controller) {
            showUpdateBar(sw);
          }
        });
      });
    } catch (err) {
      console.warn('离线功能没启用成功（不影响正常使用）:', err);
    }
  });

  // 用户点了"立即更新"，新版本接管后再刷新页面
  // 绝不自动刷新 —— 房东可能正在填房间信息，突然刷新会弄丢
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloading) return;
    reloading = true;
    location.reload();
  });
}

function showUpdateBar(worker) {
  const bar = document.getElementById('updateBar');
  const btn = document.getElementById('btnUpdate');
  if (!bar || !btn) return;

  bar.classList.add('show');
  btn.onclick = () => {
    btn.disabled = true;
    btn.textContent = '更新中…';
    worker.postMessage({ type: 'SKIP_WAITING' });
  };
}

/* ==========================================================================
   [SECTION: 启动]
   ========================================================================== */
(async function boot() {
  try {
    db = await openDB();

    // 申请"持久化存储"：防止手机在空间紧张时自动清掉你的账本。
    // 必须在房东还没积累数据时就做，晚了就来不及了。
    if (navigator.storage && navigator.storage.persist) {
      try {
        const already = await navigator.storage.persisted();
        if (!already) await navigator.storage.persist();
      } catch (e) { /* 不支持就算了，不影响使用 */ }
    }

    await loadAll();

    // 交叉哨兵：如果数据库是空的，但"用过了"的标记还在
    // → 说明数据可能被清掉了，必须明确告诉房东，而不是安静地给个空白 App
    const used = localStorage.getItem('lz_everUsed');
    if (!state.areas.length && used) {
      document.getElementById('notice').className = 'notice';
      renderAll();
      document.getElementById('notice').innerHTML =
        `⚠️ <b>数据好像是空的。</b><br>
         这台手机以前用过这个 App，但现在读不到数据了——
         可能是浏览器数据被清理过。<br>
         如果你导出过备份，可以用备份恢复（第 9 步做这个功能）。`;
      localStorage.setItem('lz_everUsed', '1');
      return;
    }
    localStorage.setItem('lz_everUsed', '1');

    // 第一次使用：记下"统计起始月"，避免以后填了老起租日就算出一堆历史欠租
    if (!state.settings.statsStartMonth) {
      await saveSetting('statsStartMonth', currentMonth());
    }

    renderAll();
  } catch (err) {
    console.error(err);
    document.getElementById('roomList').innerHTML =
      `<div class="empty">
         <div class="big">😵</div>
         <div>打不开账本</div>
         <div style="margin-top:8px;font-size:15px">${esc(err.message || err)}</div>
       </div>`;
  }
})();
</script>
