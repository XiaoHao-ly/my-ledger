<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="房东记账">
<title>房东记账</title>

<!-- 告诉手机：我是个 App，图标在这几个地方 -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png">

<style>
/* ==========================================================================
   [SECTION: 配色与基础样式]
   颜色统一在这里定义，以后想换配色只改这一块。
   ========================================================================== */
:root{
  --blue:#1f6feb;        /* 主色：按钮、选中状态 */
  --blue-soft:#ddeaff;
  --green:#1a7f37;       /* 已收 */
  --green-soft:#dcfce7;
  --red:#cf222e;         /* 未收 / 未交租 */
  --red-soft:#ffe4e6;
  --amber:#bf8700;       /* 提醒用（租约已到期、金额有出入） */
  --amber-soft:#fff4d6;
  --gray:#6e7781;        /* 未租 / 空置 */
  --gray-soft:#eef1f4;

  --bg:#f2f4f7;
  --card:#ffffff;
  --line:#e3e7ec;
  --text:#1b1f24;
  --text-dim:#5b6570;

  --radius:14px;
  --shadow:0 1px 3px rgba(16,24,40,.06), 0 1px 2px rgba(16,24,40,.04);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

/* 带 hidden 的元素一律真藏起来。
   必须写 !important —— 上面那些 display:flex 的规则会盖掉手机自带的效果 */
[hidden]{display:none !important;}

html,body{margin:0;padding:0;}

body{
  /* 房东不是年轻人：基础字号调大，行高放宽 */
  font-size:17px;
  line-height:1.5;
  color:var(--text);
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",
              "Helvetica Neue",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
}
body.locked{overflow:hidden;}

/* ==========================================================================
   [SECTION: 顶栏]
   ========================================================================== */
.app-bar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:8px;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  background:var(--blue);
  color:#fff;
}
.app-bar h1{
  /* min-width:0 + overflow:hidden：顶栏按钮多了一个之后，
     万一手机屏幕特别窄，让标题先被裁掉，而不是把按钮挤出屏幕 */
  flex:1;min-width:0;overflow:hidden;white-space:nowrap;
  margin:0;
  font-size:20px;font-weight:600;letter-spacing:.5px;
}
.app-bar button{
  min-height:44px;
  border:0;border-radius:22px;
  background:rgba(255,255,255,.18);
  color:#fff;font-size:16px;font-weight:500;
  font-family:inherit;cursor:pointer;
}
.app-bar button:active{background:rgba(255,255,255,.3);}
.app-bar .btn-stat{padding:0 16px;}
.app-bar .btn-gear{padding:0 14px;font-size:19px;}
.app-bar .btn-refresh{padding:0 15px;font-size:19px;}
.app-bar .btn-search{padding:0 14px;font-size:19px;}

/* "装到桌面"按钮：只有当手机支持安装时才会出现 */
.app-bar .btn-install{
  padding:0 16px;
  background:#fff;color:var(--blue);
  font-weight:700;
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.6);}
  50%    {box-shadow:0 0 0 8px rgba(255,255,255,0);}
}

/* ==========================================================================
   [SECTION: 第一层标签 —— 区域]
   ========================================================================== */
.tabs-area{
  position:sticky;top:calc(68px + env(safe-area-inset-top));z-index:19;
  display:flex;gap:8px;
  padding:10px 16px;
  overflow-x:auto;
  background:var(--card);
  border-bottom:1px solid var(--line);
  scrollbar-width:none;
}
.tabs-area::-webkit-scrollbar{display:none;}

.tab-area{
  flex:0 0 auto;
  min-height:40px;padding:0 18px;
  display:flex;align-items:center;
  border:1px solid var(--line);
  border-radius:20px;
  background:#fff;
  color:var(--text-dim);
  font-size:16px;font-family:inherit;
  white-space:nowrap;cursor:pointer;
  transition:background .15s,border-color .15s,color .15s;
}
.tab-area[aria-selected="true"]{
  background:var(--blue-soft);
  border-color:var(--blue);
  color:var(--blue);
  font-weight:600;
}
.tab-area.add{
  border-style:dashed;
  color:var(--blue);
  border-color:#b9d0f5;
}

/* ==========================================================================
   [SECTION: 第二层标签 —— 状态]
   ========================================================================== */
.tabs-status{
  position:sticky;top:calc(119px + env(safe-area-inset-top));z-index:18;
  display:flex;
  background:var(--card);
  border-bottom:1px solid var(--line);
}
.tab-status{
  flex:1;
  min-height:52px;
  display:flex;align-items:center;justify-content:center;gap:5px;
  border:0;background:none;
  color:var(--text-dim);
  font-size:16px;font-family:inherit;
  cursor:pointer;
  border-bottom:3px solid transparent;
  transition:color .15s,border-color .15s;
}
.tab-status[aria-selected="true"]{
  color:var(--blue);
  font-weight:600;
  border-bottom-color:var(--blue);
}
.tab-status .cnt{
  min-width:20px;height:20px;padding:0 6px;
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:10px;
  background:var(--red);color:#fff;
  font-size:13px;font-weight:600;
}

/* ==========================================================================
   [SECTION: 搜索栏]
   平时藏起来（hidden），点顶栏的 🔍 才出现。
   搜索的时候，区域和状态那两排标签会一起收起来 —— 搜索是「在当前这个区域里
   找人」，跟「全部/已租/未租」那排筛选没关系，留着反而让人以为要配合着用。
   ========================================================================== */
.search-bar{
  position:sticky;top:calc(68px + env(safe-area-inset-top));z-index:19;
  display:flex;align-items:center;gap:8px;
  padding:10px 16px;
  background:var(--card);
  border-bottom:1px solid var(--line);
}
.search-bar .ico{font-size:17px;line-height:1;}
.search-bar input{
  flex:1;min-width:0;min-height:44px;
  padding:0 14px;
  border:1.5px solid var(--line);
  border-radius:22px;
  background:#fff;
  color:var(--text);
  font-size:17px;font-family:inherit;
}
.search-bar input:focus{
  outline:none;border-color:var(--blue);
}
/* 安卓/iOS 自带的那个「清除」小叉，跟我们自己的 ✕ 重复了，藏掉 */
.search-bar input::-webkit-search-cancel-button{display:none;}
.search-bar button{
  flex:0 0 auto;
  width:44px;height:44px;
  border:0;border-radius:22px;
  background:var(--gray-soft);color:var(--text-dim);
  font-size:17px;font-family:inherit;line-height:1;
  cursor:pointer;
}
.search-bar button:active{background:#e3e7ec;}

/* 搜索结果上方那行「找到 N 间房」 */
.search-count{
  padding:2px 4px 0;
  color:var(--text-dim);
  font-size:15px;
}
.search-count b{color:var(--text);font-size:17px;}

/* ==========================================================================
   [SECTION: 房间列表]
   ========================================================================== */
.room-list{
  padding:14px 16px 8px;
  display:flex;flex-direction:column;gap:12px;
}

.room-card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:16px;
  cursor:pointer;
}
.room-card:active{background:#fafbfc;}

.room-top{
  display:flex;align-items:center;gap:10px;
  margin-bottom:8px;
}
.room-no{
  font-size:22px;font-weight:700;letter-spacing:.5px;
}
.room-tags{margin-left:auto;display:flex;gap:6px;}

.tag{
  padding:3px 10px;border-radius:12px;
  font-size:14px;font-weight:600;white-space:nowrap;
}
.tag.rented  {background:var(--blue-soft); color:var(--blue);}
.tag.vacant  {background:var(--gray-soft); color:var(--gray);}
.tag.paid    {background:var(--green-soft);color:var(--green);}
.tag.unpaid  {background:var(--red-soft);  color:var(--red);}
/* 琥珀色标签：提醒用，不是「欠钱」（未收是红的）。
   2026-09-10 之前它叫 duetoday，那个状态已经被删掉了（收租日当天直接算未收）。 */
.tag.amber   {background:var(--amber-soft);color:var(--amber);}

.room-line{
  display:flex;align-items:baseline;gap:8px;
  color:var(--text-dim);font-size:16px;
}
.room-line + .room-line{margin-top:4px;}
.room-line .k{color:var(--text);font-weight:500;}
.room-line .phone{margin-left:auto;color:var(--blue);text-decoration:none;}
.room-line .money{color:var(--text);font-weight:600;font-size:17px;}
.room-line .money small{font-weight:400;font-size:14px;color:var(--text-dim);}

.room-act{margin-top:14px;}
.btn-act{
  width:100%;min-height:46px;
  border:0;border-radius:10px;
  background:var(--blue);color:#fff;
  font-size:17px;font-weight:600;font-family:inherit;
  cursor:pointer;
}
.btn-act:active{opacity:.85;}
.btn-act.ghost{
  background:#fff;color:var(--blue);
  border:1.5px solid var(--blue);
}

/* 列表底部的"添加房间" */
.btn-add-room{
  width:100%;min-height:52px;
  margin-top:2px;
  border:1.5px dashed #b9d0f5;
  border-radius:var(--radius);
  background:#fff;color:var(--blue);
  font-size:17px;font-weight:600;font-family:inherit;
  cursor:pointer;
}
.btn-add-room:active{background:var(--blue-soft);}
.btn-add-room.primary{
  border-style:solid;
  border-color:var(--blue);
  background:var(--blue);color:#fff;
}
.btn-add-room.primary:active{opacity:.85;background:var(--blue);}

/* 空状态 */
.empty{
  margin:24px 0;
  padding:40px 24px;
  text-align:center;
  color:var(--text-dim);
  background:var(--card);
  border-radius:var(--radius);
}
.empty .big{font-size:40px;margin-bottom:10px;}
.empty .btn-act{max-width:220px;margin:18px auto 0;}

/* ==========================================================================
   [SECTION: 提示条]
   ========================================================================== */
.notice{
  margin:16px;
  padding:12px 16px;
  background:var(--amber-soft);
  border-radius:10px;
  color:#7a5800;
  font-size:15px;
  line-height:1.6;
}
.notice.info{background:var(--blue-soft);color:#0b4ba8;}

/* ==========================================================================
   [SECTION: 全局提示气泡]
   ========================================================================== */
.toast{
  position:fixed;left:50%;bottom:calc(32px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(20px);
  max-width:82vw;padding:12px 20px;
  background:rgba(27,31,36,.9);color:#fff;
  border-radius:22px;font-size:16px;text-align:center;
  opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;
  z-index:99;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ==========================================================================
   [SECTION: 新版本提示条]
   发现有新版本时从顶部滑下来。绝不自动刷新——房东可能正在填房间信息，
   突然刷新等于把他填了一半的东西弄丢。
   ========================================================================== */
.update-bar{
  position:fixed;left:0;right:0;top:0;z-index:60;
  display:none;align-items:center;gap:12px;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  background:#1a7f37;color:#fff;
  font-size:16px;
  box-shadow:0 2px 10px rgba(0,0,0,.18);
}
.update-bar.show{display:flex;}
.update-bar span{flex:1;}
.update-bar button{
  min-height:40px;padding:0 16px;
  border:0;border-radius:20px;
  background:#fff;color:#1a7f37;
  font-size:16px;font-weight:600;font-family:inherit;
  cursor:pointer;white-space:nowrap;
}

/* ==========================================================================
   [SECTION: 从底部滑上来的表单面板]
   ========================================================================== */
.sheet-mask{
  position:fixed;inset:0;z-index:70;
  background:rgba(16,24,40,.45);
  opacity:0;pointer-events:none;
  transition:opacity .2s;
}
.sheet-mask.show{opacity:1;pointer-events:auto;}

.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:71;
  max-height:88vh;
  display:flex;flex-direction:column;
  background:var(--card);
  border-radius:18px 18px 0 0;
  transform:translateY(102%);
  transition:transform .25s cubic-bezier(.2,.8,.3,1);
  box-shadow:0 -4px 24px rgba(16,24,40,.16);
}
.sheet.show{transform:translateY(0);}

.sheet-head{
  display:flex;align-items:center;gap:8px;
  padding:14px 12px;
  border-bottom:1px solid var(--line);
  flex:0 0 auto;
}
.sheet-head h2{
  flex:1;margin:0;text-align:center;
  font-size:18px;font-weight:600;
}
.sheet-head button{
  min-height:44px;padding:0 12px;
  border:0;background:none;
  font-size:17px;font-family:inherit;cursor:pointer;
  color:var(--text-dim);
}
.sheet-head button.primary{color:var(--blue);font-weight:600;}
.sheet-head button:disabled{opacity:.4;}

.sheet-body{
  padding:8px 16px calc(24px + env(safe-area-inset-bottom));
  overflow-y:auto;
  flex:1 1 auto;
}
.sheet-note{
  padding:12px 16px;
  color:var(--text-dim);
  font-size:15px;
  line-height:1.7;
}

/* ==========================================================================
   [SECTION: 表单]
   ========================================================================== */
.field{
  padding:14px 0;
  border-bottom:1px solid var(--line);
}
.field:last-child{border-bottom:0;}

.field label{
  display:block;
  margin-bottom:6px;
  color:var(--text-dim);
  font-size:15px;
}
.field .hint{
  margin-top:6px;
  color:var(--text-dim);
  font-size:14px;
  line-height:1.6;
}
.field input[type=text],
.field input[type=tel],
.field input[type=number],
.field input[type=date],
.field input[type=month]{
  width:100%;
  min-height:48px;
  padding:0 14px;
  border:1.5px solid var(--line);
  border-radius:10px;
  background:#fff;
  color:var(--text);
  font-size:17px;
  font-family:inherit;
}
.field input:focus{
  outline:none;
  border-color:var(--blue);
}
.field .with-unit{
  display:flex;align-items:center;gap:10px;
}
.field .with-unit input{flex:1;}
.field .unit{color:var(--text-dim);font-size:16px;white-space:nowrap;}

/* 横向排列的小按钮组（如"层号+序号 / 纯序号 / 加前缀"） */
.seg{
  display:flex;gap:8px;flex-wrap:wrap;
}
.seg button{
  flex:1 1 30%;min-height:52px;
  padding:6px 8px;
  border:1.5px solid var(--line);
  border-radius:10px;
  background:#fff;color:var(--text-dim);
  font-size:16px;font-family:inherit;cursor:pointer;
  line-height:1.3;
}
.seg button .sub{
  display:block;font-size:13px;color:var(--text-dim);
  margin-top:2px;
}
.seg button[aria-pressed="true"]{
  border-color:var(--blue);background:var(--blue-soft);
  color:var(--blue);font-weight:600;
}
.seg button[aria-pressed="true"] .sub{color:var(--blue);}

/* 「从 __ 层 到 __ 层」这一行 */
.range{display:flex;align-items:center;gap:10px;}
.range input{flex:1;min-width:0;}
.range span{color:var(--text-dim);white-space:nowrap;font-size:16px;}

/* 批量建房前的预览清单 */
.preview{
  margin-top:16px;
  padding:14px;
  background:#f6f8fa;
  border:1px solid var(--line);
  border-radius:10px;
}
.preview-head{font-size:16px;margin-bottom:10px;color:var(--text-dim);}
.preview-head b{color:var(--blue);font-size:20px;}
.preview-chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{
  padding:4px 10px;border-radius:8px;
  background:#fff;border:1px solid var(--line);
  font-size:15px;
  font-variant-numeric:tabular-nums;
}
.chip.more{
  background:var(--blue-soft);border-color:var(--blue-soft);color:var(--blue);
}
.preview-warn{
  margin-top:12px;padding:10px 12px;
  background:var(--amber-soft);border-radius:8px;
  color:#7a5800;font-size:15px;line-height:1.6;
}
.preview-empty{color:var(--text-dim);font-size:15px;}

/* 管理列表里的一行 */
.list-row{
  display:flex;align-items:center;gap:10px;
  padding:14px 0;
  border-bottom:1px solid var(--line);
}
.list-row:last-child{border-bottom:0;}
.list-row .name{flex:1;font-size:17px;}
.list-row .sub{color:var(--text-dim);font-size:14px;}
.icon-btn{
  min-width:44px;min-height:44px;
  border:1.5px solid var(--line);
  border-radius:10px;
  background:#fff;color:var(--text-dim);
  font-size:15px;font-family:inherit;cursor:pointer;
}
.icon-btn.danger{color:var(--red);border-color:#f5c2c7;}
.icon-btn:disabled{opacity:.35;}

/* 面板里的小标题（把内容分成几块） */
.section-title{
  margin:20px 0 6px;
  padding-top:16px;
  border-top:1px solid var(--line);
  font-size:15px;font-weight:600;color:var(--text-dim);
}
.section-title:first-child{border-top:0;margin-top:0;padding-top:0;}

/* 一条收租记录 */
.rec{
  display:flex;align-items:baseline;gap:10px;
  padding:12px 0;
  border-bottom:1px solid var(--line);
}
.rec:last-child{border-bottom:0;}
.rec .m{flex:1;font-size:17px;font-weight:500;}
.rec .amt{font-size:17px;font-weight:600;}
.rec .d{color:var(--text-dim);font-size:14px;}
.rec .diff{color:var(--amber);font-size:14px;}

/* 「确认收租」框底下的实时预览：这笔钱会算作哪个月的收入 */
.pay-preview{
  margin-top:14px;padding:12px 14px;
  border-radius:10px;
  background:var(--blue-soft);color:var(--blue);
  font-size:16px;font-weight:600;line-height:1.6;
}
.pay-preview b{font-size:18px;}
.pay-preview.mismatch{
  background:var(--amber-soft);color:#7a5800;font-weight:400;
}
.pay-preview.mismatch b{font-weight:700;}
/* 「改成 7 月」「去补录」这类就地修正的小按钮，琥珀底和蓝底都能用 */
.fix{
  display:inline-block;margin-top:10px;
  min-height:44px;padding:0 16px;
  border:1.5px solid #d9a300;border-radius:10px;
  background:#fff;color:#7a5800;
  font-size:16px;font-weight:600;font-family:inherit;
  cursor:pointer;
}
.fix:active{background:#fdf3d6;}
.pay-preview .fix{border-color:#9dc0f5;color:var(--blue);}
.pay-preview .fix:active{background:var(--blue-soft);}

/* 「以前的租金记一下」清单里的一行 */
.pick-row{
  display:flex;align-items:center;gap:8px;
  padding:12px 0;
  border-bottom:1px solid var(--line);
}
.pick-row:last-child{border-bottom:0;}
.pick-row .m{flex:1;min-width:0;}
.pick-row .m .t{font-size:17px;font-weight:600;}
.pick-row .m .s{color:var(--text-dim);font-size:14px;margin-top:3px;}
.pick-row .btn-yes,
.pick-row .btn-no{
  min-height:44px;padding:0 14px;
  border-radius:10px;
  font-size:16px;font-weight:600;font-family:inherit;
  cursor:pointer;white-space:nowrap;
}
.pick-row .btn-yes{border:0;background:var(--green);color:#fff;}
.pick-row .btn-yes:active{opacity:.85;}
.pick-row .btn-no{border:1.5px solid var(--line);background:#fff;color:var(--text-dim);}
.pick-row .btn-no:active{background:var(--gray-soft);}
/* 已经处理掉的月份：整行淡下去，不干扰 */
.pick-row.done .m .t,
.pick-row.done .m .s{color:var(--text-dim);font-weight:400;}

/* 租客信息卡片 */
.tenant-box{
  padding:14px;
  background:#f6f8fa;
  border-radius:10px;
  margin-bottom:4px;
}
.tenant-box .who{font-size:19px;font-weight:600;}
.tenant-box .meta{color:var(--text-dim);font-size:15px;margin-top:4px;line-height:1.6;}

/* 次要按钮（白底蓝框，整行） */
.btn-line{
  width:100%;min-height:48px;

<script src="./export.js"></script>

<script>
/* ==========================================================================
   [SECTION: 数据库层]
   --------------------------------------------------------------------------
   五本"账本"：areas（区域） rooms（房间） tenancies（租约）
              payments（收款记录） meta（设置）

   ⚠️ 改这里之前先读 CLAUDE.md 第 13 章。两条不能破的规矩：
     1. switch 里故意不写 break —— 保证任何旧版本都能升到最新
     2. 永远不删表、永远不给已有的表改主键（IndexedDB 不支持，改了会丢数据）
   ========================================================================== */

const DB_NAME = 'lz_rent_db';
const DB_VERSION = 1;

function openDB() {
  return new Promise((resolve, reject) => {
    let req;
    try { req = indexedDB.open(DB_NAME, DB_VERSION); }
    catch (err) { reject(err); return; }

    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      // 任何异常都不能让它抛出去 —— 否则数据库会卡在旧版本打不开
      try {
        switch (e.oldVersion) {          // ⚠️ 故意不写 break，级联穿透
          case 0: {
            db.createObjectStore('areas', { keyPath: 'id' })
              .createIndex('order', 'order');

            db.createObjectStore('rooms', { keyPath: 'id' })
              .createIndex('areaId', 'areaId');

            db.createObjectStore('tenancies', { keyPath: 'id' })
              .createIndex('roomId', 'roomId');

            const pay = db.createObjectStore('payments', { keyPath: 'id' });
            pay.createIndex('roomId', 'roomId');
            pay.createIndex('room_month', ['roomId', 'month']);

            db.createObjectStore('meta', { keyPath: 'key' });
            break;
          }
          // 将来加表写在这里，例如：
          // case 1: { db.createObjectStore('adjustments', { keyPath:'id' }); }
        }
      } catch (err) {
        console.error('[数据库] 升级时出错，已忽略以免卡死：', err);
      }
    };

    req.onsuccess = () => resolve(req.result);
    req.onerror   = () => reject(req.error);
    req.onblocked = () => reject(new Error('数据库被其他页面占用，请关掉其他标签页重试'));
  });
}

let db = null;

/** 把一次数据库操作包成 Promise，并统一处理出错 */
function tx(storeName, mode) {
  return db.transaction(storeName, mode).objectStore(storeName);
}

function req2p(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror   = () => reject(request.error);
  });
}

const dbGetAll = (store) => req2p(tx(store, 'readonly').getAll());
const dbGet    = (store, key) => req2p(tx(store, 'readonly').get(key));
const dbPut    = (store, value) => req2p(tx(store, 'readwrite').put(value));
const dbDel    = (store, key) => req2p(tx(store, 'readwrite').delete(key));

/** 一批写入放在同一个事务里 —— 要么全成功，要么全失败，不会写一半 */
function dbPutAll(store, list) {
  if (!list.length) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const t = db.transaction(store, 'readwrite');
    const os = t.objectStore(store);
    for (const item of list) os.put(item);
    t.oncomplete = () => resolve();
    t.onerror    = () => reject(t.error);
    t.onabort    = () => reject(t.error || new Error('写入被中断'));
  });
}

/* ---------- 生成不会重复的编号 ---------- */
function newId(prefix) {
  if (crypto && crypto.randomUUID) return prefix + '_' + crypto.randomUUID();
  // 老浏览器兜底
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}

/* ==========================================================================
   [SECTION: 内存里的数据]
   启动时一次读进内存，之后界面都从内存渲染。
   写库成功后立刻更新内存并重渲染 —— 绝不允许"界面先变了、写库却失败"。
   ========================================================================== */

const state = {
  areas: [],
  rooms: [],
  tenancies: [],
  payments: [],
  settings: {
    defaultRentDueDay: 5,
    statsStartMonth: '',
    lastBackupAt: 0,
    firstUseAt: 0,       // 第一次打开这个 App 的时间，用来算"该提醒备份了吗"
  },
  loaded: false,
};

let curArea = null;     // 当前选中的区域 id
let curStatus = 'all';  // 当前选中的状态

/** 从数据库读全部数据到内存 */
async function loadAll() {
  const [areas, rooms, tenancies, payments] = await Promise.all([
    dbGetAll('areas'), dbGetAll('rooms'),
    dbGetAll('tenancies'), dbGetAll('payments'),
  ]);

  state.areas     = areas.filter(a => !a.isDeleted).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  state.rooms     = rooms.filter(r => !r.isDeleted);
  state.tenancies = tenancies.filter(t => !t.isDeleted);
  state.payments  = payments;

  // 设置项
  const metas = await dbGetAll('meta');
  for (const m of metas) {
    if (m.key in state.settings) state.settings[m.key] = m.value;
  }

  state.loaded = true;

  // 当前选中的区域如果没了（刚被删），自动切到第一个
  if (!state.areas.some(a => a.id === curArea)) {
    curArea = state.areas.length ? state.areas[0].id : null;
  }
}

async function saveSetting(key, value) {
  state.settings[key] = value;
  await dbPut('meta', { key, value });
}

/* ==========================================================================
   [SECTION: 取出某间房的租约 / 收款]
   ========================================================================== */

const tenanciesOf = (roomId) => state.tenancies.filter(t => t.roomId === roomId);
const paymentsOf  = (roomId) => state.payments.filter(p => p.roomId === roomId);

/** 这间房现在租出去了吗（有没有一份租约覆盖今天） */
function isRentedNow(room) {
  const today = todayStr();
  return tenanciesOf(room.id).some(t => leaseCoversDay(t, today));
}

/**
 * 这间房这个月，**现在这个租客**的租金收到没有。
 *
 * ⚠️ 不是「这间房这个月有没有钱进账」—— 那会把上一个租客交的算到新租客头上。
 * 房东 2026-09-10 报的 bug 就是它：张三 9 月交过，李四 9 月住进来就算已收。
 * 判定逻辑在 calc.js 的 paymentsForActiveLease（纯函数，有测试盯着）。
 */
function isPaidInMonth(room, ym) {
  return paymentsForActiveLease(
    paymentsOf(room.id), tenanciesOf(room.id), ym).length > 0;
}

/** 这间房每个月的状态 */
function monthStateOf(room, ym) {
  return roomMonthState({
    tenancies: tenanciesOf(room.id),
    hasPayment: isPaidInMonth(room, ym),
    room,
    ym,
    today: todayStr(),
    defaults: { rentDueDay: state.settings.defaultRentDueDay },
  });
}

/** 「以前的租金记一下」最多往回看多少个月（避免三年前的老租约刷出一长串） */
const BACKFILL_MONTHS = 12;

/**
 * 这间房从起租月到当前月，每个月的情况 —— 给「补记以前月份」清单用。
 * 只列租出去的月份（vacant 的跳过）。
 *
 * ⚠️ 这里**不读** settings.statsStartMonth。那个设置一旦启用，
 *    会把「开始用 App 那个月」之前的月份当成不存在 —— 而房东要补录的
 *    恰恰就是那些月份。要怎么用它，得先问房东（见 CLAUDE.md 7.4）。
 *
 * @returns {{ rows: Array<{ym,st,due,amount}>, truncated: boolean }}
 *          truncated = 因为超过 12 个月而被截掉了更早的月份
 */
function pendingMonths(room) {
  const ts = tenanciesOf(room.id);
  const starts = ts
    .map(t => t.startDate && t.startDate.slice(0, 7))
    .filter(s => s && isValidMonth(s))
    .sort();
  if (!starts.length) return { rows: [], truncated: false };

  const cm = currentMonth();
  const today = todayStr();
  const defaults = { rentDueDay: state.settings.defaultRentDueDay };

  const floor = addMonths(cm, -(BACKFILL_MONTHS - 1));
  let from = starts[0];
  const truncated = from < floor;
  if (truncated) from = floor;

  const rows = [];
  for (let ym = from; ym <= cm; ym = addMonths(ym, 1)) {
    const st = roomMonthState({
      tenancies: ts,
      hasPayment: isPaidInMonth(room, ym),
      room, ym, today, defaults,
    });
    if (st === 'vacant') continue;
    rows.push({
      ym, st,
      due: effectiveDueDate(room, ts, ym, defaults),
      amount: rentOfLastActiveLeaseInMonth(ts, ym) || room.rent || 0,
    });
  }
  return { rows, truncated };
}

/** 这间房有几个「过了收租日、账上还没记」的月份 */
function overdueMonthsOf(room) {
  return pendingMonths(room).rows.filter(r => r.st === 'overdue');
}

/** 入口：打开「以前的租金记一下」清单（会清掉上次的「这次先不记」标记） */
function openBackfill(room) {
  backfillSkipped = new Set();
  sheetBackfill(room);
}

/* ==========================================================================
   [SECTION: 界面小组件 —— 提示气泡 / 表单面板]
   ========================================================================== */

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

let sheetOnOk = null;
let sheetOnClose = null;

/**
 * 打开底部面板
 * @param title    标题
 * @param bodyHtml 表单内容
 * @param onOk     点"保存"时调用，返回 false 表示校验没过、不要关闭
 */
function openSheet({ title, bodyHtml, onOk, okText = '保存', showOk = true }) {
  document.getElementById('sheetTitle').textContent = title;
  document.getElementById('sheetCancel').textContent = showOk ? '取消' : '关闭';

  // 把 sheetBody 整个换成一个干净的新元素。
  // 这样上一次挂在上面的点击事件会随着旧元素一起消失，
  // 反复打开同一个面板也不会让事件越堆越多（堆多了会一次触发好几次）。
  const old = document.getElementById('sheetBody');
  const fresh = old.cloneNode(false);   // cloneNode(false) 不复制子节点，也不复制事件
  fresh.id = 'sheetBody';
  old.parentNode.replaceChild(fresh, old);
  fresh.innerHTML = bodyHtml;

  const okBtn = document.getElementById('sheetOk');
  okBtn.textContent = okText;
  okBtn.hidden = !showOk;
  okBtn.disabled = false;
  sheetOnOk = onOk || null;
  sheetOnClose = null;

  document.getElementById('sheetMask').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  document.body.classList.add('locked');
}

function closeSheet() {
  document.getElementById('sheetMask').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
  document.body.classList.remove('locked');
  const cb = sheetOnClose;
  sheetOnOk = null;
  sheetOnClose = null;
  if (cb) cb();
}

document.getElementById('sheetCancel').addEventListener('click', closeSheet);
document.getElementById('sheetMask').addEventListener('click', closeSheet);

document.getElementById('sheetOk').addEventListener('click', async () => {
  if (!sheetOnOk) return closeSheet();
  const btn = document.getElementById('sheetOk');
  btn.disabled = true;
  try {
    const r = await sheetOnOk();
    if (r !== false) closeSheet();
  } catch (err) {
    console.error(err);
    toast('操作失败，数据没有改变');
  } finally {
    btn.disabled = false;
  }
});

/** 问一句"确定吗"，用户点了确定才继续。返回 true / false */
function confirmSheet({ title, message, okText = '确定' }) {
  return new Promise((resolve) => {
    let done = false;
    openSheet({
      title,
      bodyHtml: `<div class="sheet-note">${message}</div>`,
      okText,
      onOk: () => { done = true; resolve(true); return true; },
    });
    // 面板被关掉（点了取消 / 点了遮罩）也算答复 = 不要删
    sheetOnClose = () => { if (!done) resolve(false); };
  });
}

/* ==========================================================================
   [SECTION: 表单字段生成]
   ========================================================================== */

const esc = (s) => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const attr = (s) => esc(s).replace(/\n/g, ' ');

function fText(id, label, value, { placeholder = '', hint = '', type = 'text', inputmode = '' } = {}) {
  return `<div class="field">
    <label for="${id}">${esc(label)}</label>
    <input id="${id}" type="${type}" ${inputmode ? `inputmode="${inputmode}"` : ''}
           value="${attr(value)}" placeholder="${attr(placeholder)}">
    ${hint ? `<div class="hint">${hint}</div>` : ''}
  </div>`;
}

function fMoney(id, label, value, { hint = '' } = {}) {
  return `<div class="field">
    <label for="${id}">${esc(label)}</label>
    <div class="with-unit">
      <input id="${id}" type="number" inputmode="decimal" min="0" step="0.01"
             value="${value === '' || value == null ? '' : attr(value)}" placeholder="0">
      <span class="unit">元</span>
    </div>
    ${hint ? `<div class="hint">${hint}</div>` : ''}
  </div>`;
}

function fDate(id, label, value, { hint = '' } = {}) {
  return `<div class="field">
    <label for="${id}">${esc(label)}</label>
    <input id="${id}" type="date" value="${attr(value)}">
    ${hint ? `<div class="hint">${hint}</div>` : ''}
  </div>`;
}

/** 读表单里的值，去掉首尾空格 */
const val = (id) => (document.getElementById(id)?.value ?? '').trim();

/** 读金额，空字符串当 0 */
const valMoney = (id) => {
  const v = val(id);
  if (v === '') return 0;
  const n = Number(v);
  return isFinite(n) && n >= 0 ? n : NaN;
};

/* ==========================================================================
   [SECTION: 区域相关操作]
   ========================================================================== */

async function createArea(name) {
  const area = {
    id: newId('a'),
    name,
    order: state.areas.length ? Math.max(...state.areas.map(a => a.order ?? 0)) + 1 : 1,
    rentDueDay: null,
    isDeleted: false,
    createdAt: Date.now(),
    updatedAt: Date.now(),
  };
  await dbPut('areas', area);
  state.areas.push(area);
  curArea = area.id;
  renderAll();
}

async function renameArea(area, name) {
  const next = { ...area, name, updatedAt: Date.now() };
  await dbPut('areas', next);
  Object.assign(area, next);
  renderAll();
}

async function deleteArea(area) {
  const rooms = state.rooms.filter(r => r.areaId === area.id);
  const next = { ...area, isDeleted: true, updatedAt: Date.now() };
  await dbPut('areas', next);

  // 区域删了，底下的房间也一起收进回收站（不是真删，以后能救回来）
  if (rooms.length) {
    await dbPutAll('rooms', rooms.map(r => ({ ...r, isDeleted: true, updatedAt: Date.now() })));
    const ids = new Set(rooms.map(r => r.id));
    state.rooms = state.rooms.filter(r => !ids.has(r.id));
  }
  state.areas = state.areas.filter(a => a.id !== area.id);

  if (curArea === area.id) curArea = state.areas.length ? state.areas[0].id : null;
  renderAll();
}

async function moveArea(area, dir) {
  const i = state.areas.findIndex(a => a.id === area.id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= state.areas.length) return;

  const a = state.areas[i], b = state.areas[j];
  const ao = a.order ?? i, bo = b.order ?? j;
  await dbPutAll('areas', [
    { ...a, order: bo, updatedAt: Date.now() },
    { ...b, order: ao, updatedAt: Date.now() },
  ]);
  state.areas[i] = { ...b, order: ao };
  state.areas[j] = { ...a, order: bo };
  state.areas.sort((x, y) => (x.order ?? 0) - (y.order ?? 0));
  renderAll();
}

/* ==========================================================================
   [SECTION: 房间相关操作]
   ========================================================================== */

async function createRoom(data) {
  const room = {
    id: newId('r'),
    areaId: data.areaId,
    no: data.no,
    rent: data.rent,
    rentDueDay: data.rentDueDay,     // null = 用全局默认
    deposit: data.deposit,
    isDeleted: false,
    createdAt: Date.now(),
    updatedAt: Date.now(),
  };
  await dbPut('rooms', room);
  state.rooms.push(room);
  renderAll();
  return room;
}

async function updateRoom(room, patch) {
  const next = { ...room, ...patch, updatedAt: Date.now() };
  await dbPut('rooms', next);
  Object.assign(room, next);
  renderAll();
}

async function deleteRoom(room) {
  const next = { ...room, isDeleted: true, updatedAt: Date.now() };
  await dbPut('rooms', next);
  state.rooms = state.rooms.filter(r => r.id !== room.id);
  renderAll();
}

/** 房号按"人眼习惯"排序：1 → 2 → 10 → 101，而不是 1 → 10 → 101 → 2 */
const naturalCompare = (a, b) =>
  String(a).localeCompare(String(b), 'zh-CN', { numeric: true, sensitivity: 'base' });

const roomsOfArea = (areaId) =>
  state.rooms.filter(r => r.areaId === areaId)
    .sort((a, b) => naturalCompare(a.no, b.no));

/* ==========================================================================
   [SECTION: 租约（谁在住、住多久、多少钱）
   一个房间可以有多份租约，按时间顺序排。
   换租客是「新增一份」，不是「改掉上一份」—— 所以历史永远查得到。
   ========================================================================== */

/** 两段时间有没有重叠。结束日为空 = 一直持续下去 */
function rangesOverlap(aStart, aEnd, bStart, bEnd) {
  const aE = aEnd || '9999-12-31';
  const bE = bEnd || '9999-12-31';
  return aStart <= bE && bStart <= aE;
}

/** 这间房有没有别的租约跟 [startDate, endedAt] 撞上（换租客时防止填错日期） */
function tenancyConflict(roomId, startDate, endedAt, excludeId) {
  return state.tenancies.find(t =>
    t.roomId === roomId &&
    t.id !== excludeId &&
    rangesOverlap(t.startDate, t.endedAt, startDate, endedAt)
  ) || null;
}

async function createTenancy(room, data) {
  const t = {
    id: newId('t'),
    roomId: room.id,
    tenantName: data.tenantName,
    tenantPhone: data.tenantPhone,
    monthlyRent: data.monthlyRent,
    deposit: data.deposit,
    startDate: data.startDate,
    plannedEndDate: data.plannedEndDate || '',
    endedAt: null,
    note: '',
    isDeleted: false,
    createdAt: Date.now(),
    updatedAt: Date.now(),
  };
  await dbPut('tenancies', t);
  state.tenancies.push(t);
  renderAll();
  return t;
}

async function updateTenancy(tenancy, patch) {
  const next = { ...tenancy, ...patch, updatedAt: Date.now() };
  await dbPut('tenancies', next);
  Object.assign(tenancy, next);
  renderAll();
  return tenancy;
}

/** 办退租：写下实际退租日，租约到此为止（退租当天还算在租） */
async function endTenancy(tenancy, endDate) {
  const next = { ...tenancy, endedAt: endDate, updatedAt: Date.now() };
  await dbPut('tenancies', next);
  Object.assign(tenancy, next);
  renderAll();
  return tenancy;
}

   「未交租」不存，是算出来的 —— 见 CLAUDE.md 第 6.3 节
   ========================================================================== */

/** 这条记录对应的租约（用于显示当时是谁租的） */
const tenancyById = (id) => state.tenancies.find(t => t.id === id) || null;

async function createPayment(room, { month, amount, payDate }) {
  const tenancies = tenanciesOf(room.id);
  const lease = activeLeaseInMonth(tenancies, month);
  const p = {
    id: newId('p'),
    roomId: room.id,
    tenancyId: lease ? lease.id : null,
    month,
    amount,
    expected: rentOfLastActiveLeaseInMonth(tenancies, month) || room.rent || 0,
    payDate,
    note: '',
    createdAt: Date.now(),
    updatedAt: Date.now(),
  };
  await dbPut('payments', p);
  state.payments.push(p);
  renderAll();
  return p;
}

/** 撤销一条收款记录（点错了就用这个，删掉即完全复原） */
async function deletePayment(payment) {
  await dbDel('payments', payment.id);
  state.payments = state.payments.filter(p => p.id !== payment.id);
  renderAll();
}

/**
 * 这间房这个月、**现在这个租客**的收款记录（正常 0 或 1 条）。
 * 同月换过租客时各算各的 —— 所以李四能单独记 9 月，不会被张三那笔挡住。
 */
const paymentsOfMonth = (room, ym) =>
  paymentsForActiveLease(paymentsOf(room.id), tenanciesOf(room.id), ym);

const paymentsSortedDesc = (roomId) =>
  state.payments.filter(p => p.roomId === roomId)
    .sort((a, b) => b.month.localeCompare(a.month));

const STATUS_TABS = [
  { key: 'all',    label: '全部'   },
  { key: 'rented', label: '已租'   },
  { key: 'vacant', label: '未租'   },
  { key: 'unpaid', label: '未交租' },
];

const thisMonth = () => currentMonth();

/* ==========================================================================
   [SECTION: 搜索]
   房东 2026-09-11 要的：「打个名字，把那间房找出来」。

   两条口径是房东自己选的，别自作主张改：
     · 只搜「当前区域」—— 搜之前先切到那个人住的区域
     · 只搜「现在在住的租客」—— 搬走的人搜不到（但记录一直在房间里）

   「怎么算对得上」的判定在 calc.js 的 roomMatchesQuery（纯函数，有测试盯着）。
   ========================================================================== */

let searchOn    = false;   // 搜索框是不是打开的
let searchQuery = '';      // 搜索词

/** 在当前区域里，找出跟搜索词对得上的房间（顺序沿用房号的自然顺序） */
function searchHits(area, query, ym) {
  if (!area) return [];
  return roomsOfArea(area.id).filter(r => {
    // 空房传 null → 只有房号能搜到它，姓名和电话不参与
    const tenant = isRentedNow(r) ? tenantOfMonth(tenanciesOf(r.id), ym) : null;
    return roomMatchesQuery(r, tenant, query);
  });
}

/** 搜索时把区域、状态那两排标签收起来 —— 搜索用不上它们，留着反而碍事 */
function syncTabsVisibility() {
  document.getElementById('tabsArea').hidden   = searchOn;
  document.getElementById('tabsStatus').hidden = searchOn;
}

function openSearch() {
  searchOn = true;
  searchQuery = '';
  const inp = document.getElementById('searchInput');
  inp.value = '';                                   // 每次打开都是干净的
  document.getElementById('searchBar').hidden = false;
  syncTabsVisibility();
  inp.focus();                                      // 手机上直接弹出键盘，省一次点击
  renderRooms();
}

/** 关掉搜索：区域标签、状态标签、原来的房间列表，全都原样回来 */
function closeSearch() {
  searchOn = false;
  searchQuery = '';
  document.getElementById('searchInput').value = '';
  document.getElementById('searchBar').hidden = true;
  syncTabsVisibility();
  renderRooms();
}

/** 判断一间房符不符合某个状态 */
function matchStatus(room, key) {
  if (key === 'all')    return true;
  const rented = isRentedNow(room);
  if (key === 'rented') return rented;
  if (key === 'vacant') return !rented;
  if (key === 'unpaid') return monthStateOf(room, thisMonth()) === 'overdue';
  return true;
}

function visibleRooms() {
  if (!curArea) return [];
  return roomsOfArea(curArea).filter(r => matchStatus(r, curStatus));
}

function countOf(key) {
  if (!curArea) return 0;
  return roomsOfArea(curArea).filter(r => matchStatus(r, key)).length;
}

/**
 * 一张房间卡片长什么样。
 *
 * 房间列表和搜索结果共用这一个 —— 这样「搜出来的房间」跟「平时看到的房间」
 * 长得一模一样，点进去照样能改租金、能点「确认已收」。
 */
function roomCardHtml(r, ym) {
  const rented = isRentedNow(r);
  const st = monthStateOf(r, ym);
  const t = activeLeaseInMonth(tenanciesOf(r.id), ym);
  const tenant = rented
    ? tenantOfMonth(tenanciesOf(r.id), ym)
    : { name: '', phone: '' };

  // —— 状态标签 ——
  let tags = rented
    ? `<span class="tag rented">已租</span>`
    : `<span class="tag vacant">未租</span>`;

  if (rented) {
    // 收租日当天及以后都算 overdue（房东 2026-09-10 要求：到了当天就该催）
    if (st === 'paid')     tags += `<span class="tag paid">✓ 已收</span>`;
    if (st === 'overdue')  tags += `<span class="tag unpaid">⚠ 未收</span>`;

    // 租约到期只是提醒，不影响统计 —— 没点「办退租」就继续算在租
    if (t && t.plannedEndDate && t.plannedEndDate < todayStr()) {
      tags += `<span class="tag amber">租约已到期</span>`;
    }
  }

  // —— 第二行：租客 / 空置 ——
  const line2 = tenant.name
    ? `<div class="room-line">
         <span class="k">${esc(tenant.name)}</span>
         ${tenant.phone ? `<a class="phone" href="tel:${attr(tenant.phone.replace(/\s/g,''))}"
            data-act="noop">${esc(tenant.phone)}</a>` : ''}
       </div>`
    : `<div class="room-line"><span>${rented ? '已租' : '暂时没人住'}</span></div>`;

  // —— 第三行：租金 / 租期 ——
  // 租出去了就显示那个租客实际付的租金（可能因为涨租跟房间标准租金不一样）
  const shownRent = (rented && t && t.monthlyRent) ? t.monthlyRent : r.rent;
  const rentLine = `<div class="room-line">
      <span class="money">${fmtYuan(shownRent)}<small>/月</small></span>
      ${t && t.startDate ? `<span>租期 ${esc(t.startDate)} 起</span>` : ''}
    </div>`;

  // —— 按钮 ——
  const btn = rented
    ? (st === 'paid'
        ? `<button class="btn-act ghost" data-act="pay" data-room="${attr(r.id)}">已收 · 点击可撤销</button>`
        : `<button class="btn-act" data-act="pay" data-room="${attr(r.id)}">确认已收</button>`)
    : `<button class="btn-act ghost" data-act="rent" data-room="${attr(r.id)}">登记租客</button>`;

  return `<article class="room-card" data-act="edit" data-room="${attr(r.id)}">
            <div class="room-top">
              <span class="room-no">${esc(r.no)}</span>
              <span class="room-tags">${tags}</span>
            </div>
            ${line2}
            ${rentLine}
            <div class="room-act">${btn}</div>
          </article>`;
}

/** 搜索结果：搜到就列出来；搜不到，说清楚「在哪儿找的、为什么没有」 */
function renderSearchResults(el) {
  const q    = searchQuery.trim();
  const area = state.areas.find(a => a.id === curArea) || null;

  // 刚打开、还没打字
  if (!q) {
    el.innerHTML = `<div class="empty">
        <div class="big">🔍</div>
        <div>打几个字，把房间找出来</div>
        <div style="margin-top:8px;font-size:15px">
          租客姓名、房号、电话都能搜<br>
          比如「张三」「101」「1381234」
        </div>
      </div>`;
    return;
  }

  if (!area) {
    el.innerHTML = `<div class="empty">
        <div class="big">🔍</div>
        <div>还没有区域</div>
        <div style="margin-top:8px;font-size:15px">
          搜索是在「当前区域」里找房间，先建一个区域吧。
        </div>
      </div>`;
    return;
  }

  const ym = thisMonth();
  const hits = searchHits(area, q, ym);

  if (!hits.length) {
    // ⚠️ 把「在哪儿找的、找的是谁」写清楚 ——
    //    不然房东会以为数据丢了（其实人在别的区域、或者早就搬走了）
    el.innerHTML = `<div class="empty">
        <div class="big">🔍</div>
        <div>没找到「${esc(q)}」</div>
        <div style="margin-top:8px;font-size:15px">
          只在「${esc(area.name)}」里找<b>现在住着</b>的租客。<br>
          要是人在别的区域，先关掉搜索、切到那个区域再搜。
        </div>
      </div>`;
    return;
  }

  el.innerHTML =
    `<div class="search-count">在「${esc(area.name)}」找到 <b>${hits.length}</b> 间房</div>`
    + hits.map(r => roomCardHtml(r, ym)).join('');
}

function renderRooms() {
  const el = document.getElementById('roomList');

  // 搜索状态：房间列表换成搜索结果
  if (searchOn) { renderSearchResults(el); return; }

  // 一个区域都没有 → 第一次使用
  if (!state.areas.length) {
    el.innerHTML = `<div class="empty">
        <div class="big">🏠</div>
        <div>还没有区域</div>
        <div style="margin-top:8px;font-size:15px">
          先建一个区域，比如「城东小区3栋」「老房子」
        </div>
        <button class="btn-act" data-act="newArea">＋ 新建区域</button>
      </div>`;
    return;
  }

  const list = visibleRooms();

  if (!list.length) {
    el.innerHTML = `<div class="empty">
        <div class="big">🔍</div>
        <div>这里还没有房间</div>
        <div style="margin-top:8px;font-size:15px">
          整栋楼的话，填「1层到6层、每层4户」一次就建好了
        </div>
        <button class="btn-act" data-act="batchRooms">＋ 批量建房</button>
        <button class="btn-act ghost" style="margin-top:10px"
                data-act="newRoom">＋ 单个房间</button>
      </div>`;
    return;
  }

  const ym = thisMonth();

  el.innerHTML = list.map(r => roomCardHtml(r, ym)).join('') + `
    <button class="btn-add-room primary" data-act="batchRooms">＋ 批量建房</button>
    <button class="btn-add-room" data-act="newRoom">＋ 单个房间</button>`;
}

function renderNotice() {
  const el = document.getElementById('notice');

  if (!state.areas.length) { el.style.display = 'none'; return; }
  el.style.display = '';

  const first = state.settings.firstUseAt || 0;
  const last  = state.settings.lastBackupAt || 0;
  const DAY   = 86400000;

  // 用了超过一周、而且（从没备份过 或 超过 30 天没备份）→ 温和地提醒一下
  // 房东不会自己记得备份，所以这个提醒是必要的
  const needBackup = state.rooms.length > 0
    && Date.now() - first > 7 * DAY
    && (!last || Date.now() - last > 30 * DAY);

  if (needBackup) {
    el.className = 'notice';
    el.innerHTML = last
      ? `📦 已经 ${daysAgoText(last)}备份了。点右上角 ⚙ →「导出备份」存一份。`
      : `📦 你还没有备份过。数据只在这台手机里，建议点右上角 ⚙ →「导出备份」存一份。`;
    return;
  }

  const n = state.rooms.length;
  el.className = 'notice info';
  el.innerHTML = n
    ? `已保存 <b>${n}</b> 间房。数据存在这台手机里，刷新、关掉 App 都不会丢。`
    : `区域已建好，接下来点「＋ 批量建房」或「＋ 单个房间」把房间加进去。`;
}

function renderAll() {
  renderAreaTabs();
  renderStatusTabs();
  syncTabsVisibility();   // 正在搜索的话，这两排标签保持收起来
  renderRooms();
  renderNotice();
}

        placeholder: '例如：城东小区3栋',
        hint: '一个区域 = 一栋楼、一个小区、或一处房产。<br>建好之后，可以在里面加房间。',
      }) +
      fText('aDue', '每月几号收租（可留空）', '', {

      if (dueRaw !== '') {

          toast('收租日请填 1~31 之间的整数'); return false;
        }
      }

      const area = {
        id: newId('a'),
        name,
        order: state.areas.length ? Math.max(...state.areas.map(a => a.order ?? 0)) + 1 : 1,
        rentDueDay: due,
        isDeleted: false,
        createdAt: Date.now(),
        updatedAt: Date.now(),
      };
      await dbPut('areas', area);
      state.areas.push(area);
      curArea = area.id;
      curStatus = 'all';
      renderAll();
      toast('区域建好了');
      return true;
    },

function sheetManageAreas() {
  const rows = state.areas.map((a, i) => {
    const n = roomsOfArea(a.id).length;
    return `<div class="list-row">
      <div style="flex:1">
        <div class="name">${esc(a.name)}</div>
        <div class="sub">${n} 间房${a.rentDueDay ? ` · ${a.rentDueDay}号收租` : ''}</div>

      <button class="icon-btn" data-rn="${attr(a.id)}">改名</button>
      <button class="icon-btn danger" data-rm="${attr(a.id)}">删除</button>
    </div>`;
  }).join('');

  openSheet({
    title: '管理区域',
    showOk: false,
    bodyHtml: rows || '<div class="sheet-note">还没有区域</div>',
  });

  document.getElementById('sheetBody').addEventListener('click', async (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const id = btn.dataset.mv || btn.dataset.rn || btn.dataset.rm;
    const area = state.areas.find(a => a.id === id);

    if (btn.dataset.mv) {
      await moveArea(area, Number(btn.dataset.dir));

      closeSheet();
      sheetRenameArea(area);

      closeSheet();
      sheetDeleteArea(area);

  }, { once: true });

        批量建房会在下一步做好。
      </div>`,
    onOk: async () => {
      const no = val('rNo');
      if (!no) { toast('请填房号'); return false; }

      const areaId = document.getElementById('rArea').value;
      if (roomsOfArea(areaId).some(r => r.no === no)) {
        toast(`这个区域里已经有「${no}」了`);
        return false;
      }

      const rent = valMoney('rRent');
      if (Number.isNaN(rent)) { toast('租金请填数字'); return false; }
      const deposit = valMoney('rDeposit');
      if (Number.isNaN(deposit)) { toast('押金请填数字'); return false; }

      const dueRaw = val('rDue');
      let due = null;
      if (dueRaw !== '') {
        due = Number(dueRaw);
        if (!Number.isInteger(due) || due < 1 || due > 31) {
          toast('收租日请填 1~31 之间的整数'); return false;
        }
      }

      await createRoom({ areaId, no, rent, deposit, rentDueDay: due });
      toast(`「${no}」加好了`);
      return true;
    },
  });
}

/* ==========================================================================
   [SECTION: 批量建房]
   填「从几层到几层、每层几户」，一次生成一整栋楼的房号。
   ========================================================================== */

/** 最多允许一次生成多少间（防止手滑填个 999 把手机卡死） */
const BATCH_MAX = 500;

/**
 * 算出所有房号
 * @param mode 'floor'  层号+序号 → 101 102 103 104 / 201 202…
 *             'seq'    纯序号   → 1 2 3 … 24
 *             'prefix' 加前缀   → A101 A102…
 */
function genRoomNumbers({ mode, prefix, floorFrom, floorTo, perFloor }) {
  const out = [];
  if (mode === 'seq') {
    let n = 1;
    for (let f = floorFrom; f <= floorTo; f++) {
      for (let i = 1; i <= perFloor; i++) out.push(String(n++));
    }
  } else {
    const pre = mode === 'prefix' ? prefix : '';
    for (let f = floorFrom; f <= floorTo; f++) {
      for (let i = 1; i <= perFloor; i++) {
        out.push(pre + (f * 100 + i));   // 6层4户 → 601 602 603 604
      }
    }
  }
  return out;
}

/** 把表单读成配置对象。填得不对就返回 null */
function readBatchCfg() {
  const areaId = document.getElementById('bArea')?.value;
  const floorFrom = Number(val('bFloorFrom'));
  const floorTo   = Number(val('bFloorTo'));
  const perFloor  = Number(val('bPerFloor'));

  if (!areaId) return null;
  if (!Number.isInteger(floorFrom) || floorFrom < 1 || floorFrom > 99) return null;
  if (!Number.isInteger(floorTo)   || floorTo   < 1 || floorTo   > 99) return null;
  if (floorTo < floorFrom) return null;
  if ((floorTo - floorFrom + 1) > 100) return null;
  if (!Number.isInteger(perFloor) || perFloor < 1 || perFloor > 50) return null;
  if ((floorTo - floorFrom + 1) * perFloor > BATCH_MAX) return null;

  const mode = document.querySelector('#bMode button[aria-pressed="true"]')?.dataset.mode || 'floor';
  const prefix = val('bPrefix').replace(/[\s/\\:*?"<>|]/g, '');
  if (mode === 'prefix' && !prefix) return null;

  const rent = valMoney('bRent');
  const deposit = valMoney('bDeposit');
  if (Number.isNaN(rent) || Number.isNaN(deposit)) return null;

  const dueRaw = val('bDue');
  let due = null;
  if (dueRaw !== '') {
    due = Number(dueRaw);
    if (!Number.isInteger(due) || due < 1 || due > 31) return null;
  }

  return { areaId, mode, prefix, floorFrom, floorTo, perFloor, rent, deposit, due };
}

/** 画出"将要创建哪些房号"的预览清单 */
function renderBatchPreview() {
  const el = document.getElementById('bPreview');
  if (!el) return;

  const cfg = readBatchCfg();
  if (!cfg) {
    el.innerHTML = `<div class="preview-empty">
      请先把上面的数字填对（楼层 1~99，每层户数 1~50）</div>`;
    return;
  }

  const numbers = genRoomNumbers(cfg);
  const existing = new Set(roomsOfArea(cfg.areaId).map(r => r.no));
  const fresh = numbers.filter(n => !existing.has(n));
  const dup   = numbers.filter(n =>  existing.has(n));

  el.innerHTML = `
    <div class="preview-head">
      将要创建 <b>${fresh.length}</b> 间房
      ${dup.length ? `（另有 ${dup.length} 间已存在，会跳过）` : ''}
    </div>
    <div class="preview-chips">
      ${fresh.slice(0, 18).map(n => `<span class="chip">${esc(n)}</span>`).join('')}
      ${fresh.length > 18 ? `<span class="chip more">…还有 ${fresh.length - 18} 间</span>` : ''}
      ${fresh.length === 0 ? `<span class="preview-empty">没有新房号可建</span>` : ''}
    </div>
    ${dup.length ? `<div class="preview-warn">
      ⚠️ 这些房号已经存在，会自动跳过：<br>
      ${dup.slice(0, 12).map(esc).join('、')}${dup.length > 12 ? '…' : ''}
    </div>` : ''}`;
}

/** 这间房现在住着谁（按今天算）。没人住返回 null */
function currentTenancy(room) {
  const today = todayStr();
  return tenanciesOf(room.id).find(t => leaseCoversDay(t, today)) || null;
}

/* --------------------------------------------------------------------------
   房间详情
   房号/租金/押金/收租日 改完立刻保存，不需要点保存按钮 ——
   这样房东点「登记租客」时，不会把刚改了一半的内容弄丢。
   -------------------------------------------------------------------------- */
function sheetEditRoom(room) {
  const lease = currentTenancy(room);
  const pays = paymentsSortedDesc(room.id);

  const tenantBlock = lease
    ? `<div class="tenant-box">
         <div class="who">${esc(lease.tenantName || '（没填姓名）')}</div>
         <div class="meta">
           ${lease.tenantPhone ? `电话 ${esc(lease.tenantPhone)}<br>` : ''}
           ${esc(lease.startDate)} 起租${lease.plannedEndDate ? ` · 租到 ${esc(lease.plannedEndDate)}` : ''}<br>
           ${fmtYuan(lease.monthlyRent)}/月${lease.deposit ? ` · 押金 ${fmtYuan(lease.deposit)}` : ''}
         </div>
       </div>
       <button class="btn-line" id="btnTenancy">修改租客信息</button>
       <button class="btn-line warn" id="btnEndTenancy">办退租</button>`
    : `<div class="hint">
         还没有登记租客。登记之后这间房才算「已租」，
         也才会开始提醒你收租。
       </div>
       <button class="btn-line" id="btnTenancy">登记租客</button>`;

  const payBlock = pays.length
    ? pays.slice(0, 3).map(p => `
        <div class="rec">
          <span class="m">${esc(monthLabel(p.month))}</span>
          <span class="amt">${fmtYuan(p.amount)}</span>
          <span class="d">${esc(p.payDate)} 收</span>
        </div>`).join('')
      + (pays.length > 3 ? `<div class="hint" style="padding-top:10px">
           …还有 ${pays.length - 3} 条</div>` : '')
    : `<div class="hint">还没有收过租。</div>`;

  // 有「过了收租日、账上还没记」的月份时，把入口顶到眼前来
  const owed = overdueMonthsOf(room);
  const owedHint = owed.length
    ? `<div class="preview-warn">
         ⚠️ 还有 <b>${owed.length}</b> 个月的租金没有记：
         ${owed.map(r => esc(monthLabel(r.ym))).join('、')}<br>
         如果是漏记了，点下面的「补记以前月份」补上。
       </div>`
    : '';

  openSheet({
    title: `房间 ${room.no}`,
    showOk: false,
    bodyHtml: `
      <div class="section-title">房间信息</div>
      ${fText('rNo', '房号', room.no)}
      ${fMoney('rRent', '每月租金', room.rent, {
        hint: '改这里只影响以后，不会改动已经收过的记录',
      })}
      ${fMoney('rDeposit', '押金', room.deposit)}
      ${fText('rDue', '每月几号收租（可留空）', room.rentDueDay ?? '', {
        type: 'number', inputmode: 'numeric',
        placeholder: '用默认 ' + state.settings.defaultRentDueDay + ' 号',
        hint: '留空 = 用区域或全局默认。小月会自动提前到月底',
      })}

      <div class="section-title">当前租客</div>
      ${tenantBlock}

      <div class="section-title">收租记录</div>
      ${payBlock}
      ${owedHint}
      <button class="btn-line" id="btnPayHistory">看全部收租记录</button>
      ${owed.length ? `<button class="btn-line" id="btnBackfill">
         补记以前月份（${owed.length} 个月没记）
       </button>` : ''}

      ${tenanciesOf(room.id).length > 1
        ? `<div class="section-title">历届租客</div>
           <div class="hint">这间房换过 ${tenanciesOf(room.id).length - 1} 次租客，历史都留着。</div>
           <button class="btn-line" id="btnTenancyHistory">看历届租客</button>`
        : ''}

      <div class="section-title">危险操作</div>
      <button class="btn-danger" id="doDelRoom">删除这个房间</button>
      <div class="hint" style="margin-top:10px">
        上面的房号、租金、押金、收租日，改完立刻保存，不用点保存按钮。
      </div>`,
  });

  const body = document.getElementById('sheetBody');

  /** 把房间信息存下来。填得不对就提示并还原 */
  async function saveRoomFields() {
    const no = val('rNo');
    if (!no) {
      toast('房号不能为空');
      document.getElementById('rNo').value = room.no;
      return;
    }
    if (roomsOfArea(room.areaId).some(r => r.no === no && r.id !== room.id)) {
      toast(`这个区域里已经有「${no}」了`);
      document.getElementById('rNo').value = room.no;
      return;
    }
    const rent = valMoney('rRent');
    if (Number.isNaN(rent)) {
      toast('租金请填数字');
      document.getElementById('rRent').value = room.rent;
      return;
    }
    const deposit = valMoney('rDeposit');
    if (Number.isNaN(deposit)) {
      toast('押金请填数字');
      document.getElementById('rDeposit').value = room.deposit;
      return;
    }
    const dueRaw = val('rDue');
    let due = null;
    if (dueRaw !== '') {
      due = Number(dueRaw);
      if (!Number.isInteger(due) || due < 1 || due > 31) {
        toast('收租日请填 1~31 之间的整数');
        document.getElementById('rDue').value = room.rentDueDay ?? '';
        return;
      }
    }
    await updateRoom(room, { no, rent, deposit, rentDueDay: due });
    document.getElementById('sheetTitle').textContent = `房间 ${room.no}`;
  }

  // 离开输入框就自动保存
  body.addEventListener('change', saveRoomFields);

  body.addEventListener('click', async (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;

    if (btn.id === 'btnTenancy') {
      await saveRoomFields();
      sheetTenancy(room, currentTenancy(room));

    } else if (btn.id === 'btnEndTenancy') {
      await saveRoomFields();
      const t = currentTenancy(room);
      if (t) sheetEndTenancy(room, t);

    } else if (btn.id === 'btnPayHistory') {
      await saveRoomFields();
      sheetPayHistory(room);

    } else if (btn.id === 'btnBackfill') {
      await saveRoomFields();
      openBackfill(room);

    } else if (btn.id === 'btnTenancyHistory') {
      sheetTenancyHistory(room);

    } else if (btn.id === 'doDelRoom') {
      closeSheet();
      const yes = await confirmSheet({
        title: '删除房间',
        message: `确定删除「<b>${esc(room.no)}</b>」吗？<br><br>
          这间房的 ${tenanciesOf(room.id).length} 份租约记录和
          ${paymentsOf(room.id).length} 条收款记录也会一起隐藏。<br><br>
          删除后先放进回收站，以后还能找回来。`,
        okText: '确定删除',
      });
      if (yes) { await deleteRoom(room); toast('已收进回收站'); }
    }
  });
}

/* --------------------------------------------------------------------------
   登记 / 修改租客
   -------------------------------------------------------------------------- */
function sheetTenancy(room, tenancy) {
  const isNew = !tenancy;

  // 默认起租日：上一位退租的第二天；没有上一位就是今天
  const list = tenanciesOf(room.id).slice().sort((a, b) => a.startDate.localeCompare(b.startDate));
  const last = list.length ? list[list.length - 1] : null;
  let defaultStart = todayStr();
  if (isNew && last && last.endedAt) defaultStart = addDays(last.endedAt, 1);

  openSheet({
    title: isNew ? `登记租客 · ${room.no}` : `修改租客 · ${room.no}`,
    okText: isNew ? '登记' : '保存',
    bodyHtml: `
      ${fText('tName', '租客姓名', tenancy?.tenantName ?? '', {
        placeholder: '可以留空',
      })}
      ${fText('tPhone', '电话', tenancy?.tenantPhone ?? '', {
        type: 'tel', inputmode: 'tel', placeholder: '可以留空',
      })}
      ${fDate('tStart', '起租日', tenancy?.startDate ?? defaultStart, {
        hint: isNew ? '从这天开始，这间房算「已租」' : '改这里会影响收租提醒的日子',
      })}
      ${fDate('tEnd', '租期到（可留空）', tenancy?.plannedEndDate ?? '', {
        hint: '只是用来提前告诉你租约快到期了，不影响收租统计',
      })}
      ${fMoney('tRent', '这个租客的月租金', tenancy?.monthlyRent ?? room.rent, {
        hint: '默认用房间的租金。涨租了、或者谈的价不一样，改这里',
      })}
      ${fMoney('tDeposit', '押金', tenancy?.deposit ?? room.deposit)}
      ${fText('tDue', '每月几号收租（可留空）', room.rentDueDay ?? '', {
        type: 'number', inputmode: 'numeric',
        placeholder: '用默认 ' + state.settings.defaultRentDueDay + ' 号',
        hint: '和「房间信息」里那个是同一个值 —— 填了收租提醒才准。留空 = 用默认，小月会自动提前到月底',
      })}`,
    onOk: async () => {
      const startDate = val('tStart');
      if (!isValidDate(startDate)) { toast('请选一个正确的起租日'); return false; }

      const plannedEndDate = val('tEnd');
      if (plannedEndDate) {
        if (!isValidDate(plannedEndDate)) { toast('「租期到」的日期不对'); return false; }
        if (plannedEndDate < startDate) { toast('「租期到」不能早于起租日'); return false; }
      }

      const rent = valMoney('tRent');
      const deposit = valMoney('tDeposit');
      if (Number.isNaN(rent)) { toast('月租金请填数字'); return false; }
      if (Number.isNaN(deposit)) { toast('押金请填数字'); return false; }

      // 收租日：跟「房间信息」里那个是同一个值（存在房间上），不是这个租客独有的。
      // 房东 2026-09-10 要求把这个框也放进来 —— 录租客时看不到它，老是忘了设。
      // ⚠️ 故意不做任何推算（不按起租日算什么「前一天」）：房东明确说过不需要。
      const dueRaw = val('tDue');
      let due = null;
      if (dueRaw !== '') {
        due = Number(dueRaw);
        if (!Number.isInteger(due) || due < 1 || due > 31) {
          toast('收租日请填 1~31 之间的整数');
          return false;
        }
      }

      // 同一间房的两份租约不能重叠，否则天数会算重
      const clash = tenancyConflict(room.id, startDate, tenancy?.endedAt || null, tenancy?.id);
      if (clash) {
        toast(`跟已有的租约撞上了（那份从 ${clash.startDate} 开始）`);
        return false;
      }

      const data = {
        tenantName: val('tName'),
        tenantPhone: val('tPhone'),
        monthlyRent: rent,
        deposit,
        startDate,
        plannedEndDate,
      };

      if (isNew) {
        await createTenancy(room, data);
        toast(`${room.no} 登记好了，现在算「已租」`);
      } else {
        await updateTenancy(tenancy, data);
        toast('改好了');
      }

      // 收租日改了才写库（值没变就不必多写一次）
      if (due !== (room.rentDueDay ?? null)) {
        await updateRoom(room, { rentDueDay: due });
      }

      // 起租日在以前（不管是新登记，还是把起租日改到了更早的月份）
      // → 弹出「以前的租金记一下」，让房东逐月确认有没有收到。
      // 记的是哪个月由房东点，所以补录不会顶掉当月的收租提醒。
      // 返回 false 会让面板不关闭，此时内容已经被换成清单了。
      const movedEarlier = !isNew && startDate < (tenancy.startDate || '');
      if (isNew || movedEarlier) {
        if (overdueMonthsOf(room).length) {
          openBackfill(room);
          return false;
        }
      }
      return true;
    },
  });
}

/* --------------------------------------------------------------------------
   办退租
   -------------------------------------------------------------------------- */
function sheetEndTenancy(room, tenancy) {
  const ym = thisMonth();
  const unpaidNow = monthStateOf(room, ym) === 'overdue';

  openSheet({
    title: '办退租',
    okText: '确认退租',
    bodyHtml: `
      <div class="sheet-note" style="padding-left:0;padding-right:0">
        正在给「<b>${esc(tenancy.tenantName || room.no)}</b>」办退租
        （${esc(tenancy.startDate)} 起租）。<br>
        办完之后，这间房会变回「未租」。
      </div>
      ${fDate('tEndDate', '实际退租日', todayStr(), {
        hint: '这一天还算在租，从第二天起房子才算空出来',
      })}
      ${unpaidNow ? `<div class="preview-warn">
        ⚠️ ${esc(monthLabel(ym))}的租金还没有确认收到。<br><br>
        退租之后，这间房不会再出现在「未交租」列表里。<br>
        · 这笔钱如果<b>还要收</b> → 建议先回去点「确认已收」再退租<br>
        · 这笔钱如果<b>不要了</b> → 直接退租就行
      </div>` : ''}`,
    onOk: async () => {
      const d = val('tEndDate');
      if (!isValidDate(d)) { toast('请选一个正确的退租日'); return false; }
      if (d < tenancy.startDate) { toast('退租日不能早于起租日'); return false; }

      // 退租日如果越过后面的租约，会把天数算重
      const clash = tenancyConflict(room.id, tenancy.startDate, d, tenancy.id);
      if (clash) {
        toast(`这个退租日会把后面的租约（${clash.startDate} 起）盖住，请改小一点`);
        return false;
      }

      await endTenancy(tenancy, d);
      toast('退租办好了，房间已变回「未租」');
      return true;
    },
  });
}

/* --------------------------------------------------------------------------
   确认收租 —— 全 App 最重要的一步
   只有在这里点过确认的钱，才算进收入统计。

   ⚠️ 「收租月份」和「收款日期」是两件事（见 CLAUDE.md 4.2）：
        收租月份 = 这笔钱是「哪个月」的租金 ← 决定算进哪个月的收入
        收款日期 = 你「哪天」收到的钱
      跨月收款（9月的租、10月3号才收到）是合法的，所以两个格子必须分开。

   2026-09-10 房东报的 bug：补记 7 月租金时只改了「收款日期」，
   「收租月份」还停在 9 月 → 记成了「9月的租金、7月28日收到」→
   9 月被顶成「已收」，当月的收租提醒没了。

   现在三道防线：
     ① 房东没亲手动过月份时，改日期 → 月份自动跟着走
     ② 框底实时显示「这笔钱会算作 X 月的收入」
     ③ 两边对不上时跳琥珀色警示 + 一个「改成 X 月」按钮
   -------------------------------------------------------------------------- */

/** 从「补录清单」点进来时，记完一笔自动回到清单接着补。
 *  每次进入本函数都会重置它，只有补录那条路会设成 room.id。 */
let backfillReturnTo = null;

function sheetCollect(room, ym, opts) {
  backfillReturnTo = (opts && opts.backToBackfill) ? room.id : null;

  const list = tenanciesOf(room.id);
  const defaults = { rentDueDay: state.settings.defaultRentDueDay };
  const defaultAmount = (m) =>
    rentOfLastActiveLeaseInMonth(list, m) || room.rent || 0;

  const amount0 = defaultAmount(ym);
  // 补记以前的月份 → 收款日期默认落在那个月的收租日，而不是今天
  const date0 = ym === currentMonth()
    ? todayStr()
    : effectiveDueDate(room, list, ym, defaults);

  let monthTouched = false;   // 房东有没有亲手改过「收租月份」

  // 这间房还有别的月份没记？提醒一句，给个一按就去的入口
  const otherOwed = overdueMonthsOf(room).filter(r => r.ym !== ym);
  const owedHint = otherOwed.length
    ? `<div class="preview-warn">
         ⚠️ 这间房还有 <b>${otherOwed.length}</b> 个月的租金没有记：
         ${otherOwed.map(r => esc(monthLabel(r.ym))).join('、')}<br>
         是漏记了吗？<button type="button" class="fix" data-backfill="1">去补录</button>
       </div>`
    : '';

  openSheet({
    title: `确认收到 ${room.no} 的租金`,
    okText: '确认已收',
    bodyHtml: `
      ${fText('pMonth', '收租月份', ym, {
        type: 'month',
        hint: '这笔钱是「哪个月」的租金 —— 决定它算进哪个月的收入',
      })}
      ${fMoney('pAmount', '实际收到', amount0 || '', {
        hint: '默认是这个月的租金。租客少给了、或者扣了什么，直接改成实际收到的数',
      })}
      ${fDate('pDate', '收款日期', date0, {
        hint: '你哪天收到的钱。9月的租、10月3号才收到，就填10月3号',
      })}
      <div class="pay-preview" id="pPreview"></div>
      ${owedHint}
      <div class="sheet-note" style="padding-left:0;padding-right:0">
        确认之后，这笔钱会算进你的收入统计。<br>
        点错了不要紧，在「收租记录」里可以撤销。
      </div>`,
    onOk: async () => {
      const month = val('pMonth');
      if (!isValidMonth(month)) { toast('请选一个正确的月份'); return false; }

      const amount = valMoney('pAmount');
      if (Number.isNaN(amount) || amount <= 0) {
        toast('金额请填一个大于 0 的数'); return false;
      }

      const payDate = val('pDate');
      if (!isValidDate(payDate)) { toast('请选一个正确的收款日期'); return false; }

      // 一个月只记一笔，防止重复点导致收入翻倍
      if (paymentsOfMonth(room, month).length) {
        toast(`${monthLabel(month)}已经记过了，在「收租记录」里可以撤销`);
        return false;
      }

      await createPayment(room, { month, amount, payDate });
      toast(`记好了：${monthLabel(month)} 收到 ${fmtYuan(amount)}`);

      // 从「补录清单」点进来的 → 记完自动回去接着补下一个月。
      // 返回 false 会让面板不关闭，此时内容已经被换成清单了。
      if (backfillReturnTo === room.id) {
        backfillReturnTo = null;
        sheetBackfill(room);
        return false;
      }
      return true;
    },
  });

  const $ = (id) => document.getElementById(id);

  /** 框底那行「这笔钱会算作 X 月的收入」；对不上时变成警示 + 一键修正 */
  function refreshPreview() {
    const el = $('pPreview');
    if (!el) return;
    const month = val('pMonth');
    const payDate = val('pDate');

    if (!isValidMonth(month)) {
      el.className = 'pay-preview';
      el.textContent = '还没选收租月份';
      return;
    }

    const payYm = isValidDate(payDate) ? payDate.slice(0, 7) : '';
    if (payYm && payYm !== month) {
      const d = Number(payDate.slice(8, 10));
      // 月份一律带上年份 —— 补记去年的账时，只说「改成 9 月」会有歧义
      const payLabel = esc(monthLabel(payYm));
      const myLabel = esc(monthLabel(month));
      el.className = 'pay-preview mismatch';
      el.innerHTML =
        `⚠️ 收款日期是 <b>${payLabel}${d}日</b>，但要记成 ` +
        `<b>${myLabel}</b> 的租金。<br>` +
        `如果这笔钱是 <b>${payLabel}</b> 的租金，点这里：<br>` +
        `<button type="button" class="fix" data-fix="${attr(payYm)}">` +
        `改成 ${payLabel}</button>`;
      return;
    }

    el.className = 'pay-preview';
    el.innerHTML = `✓ 这笔钱会算作 <b>${esc(monthLabel(month))}</b> 的收入`;
  }

  /** 换月份时，金额跟着换成那个月的租金，预览也跟着变 */
  function onMonthChange() {
    const aEl = $('pAmount');
    if (aEl) aEl.value = defaultAmount(val('pMonth')) || '';
    refreshPreview();
  }

  $('pMonth').addEventListener('change', () => {
    monthTouched = true;   // 房东亲手动过了，之后不再自动跟着日期走
    onMonthChange();
  });

  $('pDate').addEventListener('change', () => {
    const mEl = $('pMonth');
    // 房东没亲手动过月份 → 让月份跟着收款日期走。
    // 这样「补记 7 月只改日期」就不会把当月顶成「已收」了。
    // 判断规则在 calc.js 的 monthForPayDate（纯函数，有测试盯着）。
    const want = monthForPayDate(val('pDate'), val('pMonth'), monthTouched);
    if (mEl && want !== val('pMonth')) {
      mEl.value = want;
      onMonthChange();
      return;
    }
    refreshPreview();
  });

  $('pPreview').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-fix]');
    if (!btn) return;
    monthTouched = true;
    const mEl = $('pMonth');
    if (mEl) mEl.value = btn.dataset.fix;
    onMonthChange();
  });

  // 「还有 N 个月没记 → 去补录」
  document.getElementById('sheetBody').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-backfill]');
    if (!btn) return;
    openBackfill(room);
  });

  refreshPreview();

  // 取消了也要回到补录清单，别让人迷路（记完那条路在上面 return false 里）
  if (opts && opts.backToBackfill) {
    sheetOnClose = () => { sheetBackfill(room); };
  }
}

/* --------------------------------------------------------------------------
   历届租客（换过租客也不会丢历史）

    if (!p) return;

/* --------------------------------------------------------------------------
   补记以前月份的租金（见 CLAUDE.md 4.2.1）

   登记租客时如果起租日在以前（9月10号才录入一个7月28日入住的老租客），
   自动弹出这张清单，一个月一行，让房东逐月确认「收到了 / 没收到」。

   「没收到」什么都不往账本里写 —— 下次打开这张清单它还会在，
   因为它确实还没收到。这不是 App 啰嗦，是它没撒谎。
   -------------------------------------------------------------------------- */

/** 本次打开清单时点了「没收到」的月份。只在内存里，不写库。 */
let backfillSkipped = new Set();

function sheetBackfill(room) {
  const { rows, truncated } = pendingMonths(room);

  if (!rows.length) {
    openSheet({
      title: `${room.no} · 以前的租金`,
      showOk: false,
      bodyHtml: `<div class="sheet-note">
        这间房还没有登记租客，没有要补的租金。</div>`,
    });
    return;
  }

  const ts = tenanciesOf(room.id).slice()
    .sort((a, b) => a.startDate.localeCompare(b.startDate));
  const firstStart = ts.length ? ts[0].startDate : rows[0].ym;
  const owed = rows.filter(r => r.st === 'overdue');

  const rowHtml = (r) => {
    const title = `${esc(monthLabel(r.ym))} · ${fmtYuan(r.amount)}`;

    // 已经记过账了
    if (r.st === 'paid') {
      const p = paymentsOfMonth(room, r.ym)[0];
      return `<div class="pick-row done">
        <div class="m">
          <div class="t">${title}</div>
          <div class="s">✓ 已记过账${p && p.payDate ? `（${esc(p.payDate)} 收）` : ''}</div>
        </div>
        <button class="icon-btn danger" data-undo="${attr(p ? p.id : '')}">撤销</button>
      </div>`;
    }

    // 过了收租日、账上还没记 —— 这一行要房东拿主意
    if (r.st === 'overdue') {
      if (backfillSkipped.has(r.ym)) {
        return `<div class="pick-row done">
          <div class="m">
            <div class="t">${title}</div>
            <div class="s">这次先不记 —— 以后收到了随时可以补</div>
          </div>
        </div>`;
      }
      return `<div class="pick-row">
        <div class="m">
          <div class="t">${title}</div>
          <div class="s">该在 ${esc(r.due)} 收</div>
        </div>
        <button class="btn-yes" data-fill="${attr(r.ym)}">收到了</button>
        <button class="btn-no" data-skip="${attr(r.ym)}">没收到</button>
      </div>`;
    }

    // pending —— 日子还没到，不是欠租，什么都不用做
    return `<div class="pick-row done">
      <div class="m">
        <div class="t">${title}</div>
        <div class="s">还没到收租日（${esc(r.due)}）</div>
      </div>
    </div>`;
  };

  openSheet({
    title: `${room.no} · 以前的租金记一下`,
    showOk: false,
    bodyHtml: `
      <div class="sheet-note" style="padding-left:0;padding-right:0">
        从 <b>${esc(firstStart)}</b> 入住到现在，这几个月的租金收到了吗？<br>
        收到就点一下，账就补上了。<b>当月的收租提醒不受影响。</b>
      </div>
      ${rows.map(rowHtml).join('')}
      ${truncated ? `<div class="hint" style="margin-top:12px">
        更早的月份（超过 ${BACKFILL_MONTHS} 个月）没有列出来。
      </div>` : ''}
      ${owed.length ? `<div class="hint" style="margin-top:12px">
        点「没收到」这一行会灰掉，但<b>不会往账本里写任何东西</b>。
        下次打开这里它还会在 —— 因为它确实还没收到。
      </div>` : ''}
      ${rows.some(r => r.st === 'paid') ? `<div class="hint" style="margin-top:6px">
        金额不对的话，点「撤销」再用「确认已收」改成实际收到的数。
      </div>` : ''}`,
  });

  document.getElementById('sheetBody').addEventListener('click', async (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;

    // 撤销已经记过的那一笔
    if (btn.dataset.undo) {
      const p = state.payments.find(x => x.id === btn.dataset.undo);
      if (!p) return;
      const yes = await confirmSheet({
        title: '撤销这笔收款',
        message: `确定撤销「<b>${esc(monthLabel(p.month))} ${fmtYuan(p.amount)}</b>」吗？<br><br>
          撤销后这笔钱会从收入统计里去掉。随时可以重新记一遍。`,
        okText: '确定撤销',
      });
      if (yes) { await deletePayment(p); toast('已撤销'); }
      sheetBackfill(room);
      return;
    }

    // 「收到了」→ 打开确认收租框（金额、日期都能改），记完自动回到这张清单
    if (btn.dataset.fill) {
      backfillSkipped.delete(btn.dataset.fill);
      sheetCollect(room, btn.dataset.fill, { backToBackfill: true });
      return;
    }

    // 「没收到」→ 这一行灰掉，什么都不写
    if (btn.dataset.skip) {
      backfillSkipped.add(btn.dataset.skip);
      sheetBackfill(room);
    }
  });
}

/* ==========================================================================
   [SECTION: 统计]
   --------------------------------------------------------------------------
   ⚠️ 这里算出来的三个数字「互相独立，不能相加也不能相减」：
       ① 实际收到   = 你点过「确认已收」的钱 ← 这才是你的收入
       ② 还有几笔没收 = 过了收租日还没确认的   ← 只是提醒，不算收入
       ③ 空置少赚的  = 按天折算的机会成本      ← 不是支出，不从收入里扣
   想改这三条的口径之前，先回去读 CLAUDE.md 第 7 章。
   ========================================================================== */

let statsYear = null;

/** 年份下拉里放哪些年（有数据的年份 + 今年） */
function availableYears() {
  const set = new Set([currentMonth().slice(0, 4)]);
  for (const p of state.payments) if (p.month) set.add(p.month.slice(0, 4));
  for (const r of state.rooms) {
    const d = dateOfTimestamp(r.createdAt);
    if (d) set.add(d.slice(0, 4));
  }
  for (const t of state.tenancies) {
    if (t.startDate) set.add(t.startDate.slice(0, 4));
    if (t.endedAt) set.add(t.endedAt.slice(0, 4));
  }
  return [...set].filter(y => /^\d{4}$/.test(y)).sort().reverse();
}

/**
 * 算一整年的账。
 * 空置损失只算到"今天"为止 —— 9月刚过到10号就只算10天，不预言未来。
 */
function statsForYear(year) {
  const cm = currentMonth();
  const today = todayStr();
  const defaults = { rentDueDay: state.settings.defaultRentDueDay };

  const rows = [];

  for (let m = 1; m <= 12; m++) {
    const ym = year + '-' + pad2(m);
    const dim = daysInMonth(ym);

    let receivedFen = 0, unpaidFen = 0, unpaidCount = 0, vacantFen = 0;

    // ① 实际收到
    for (const p of state.payments) {
      if (p.month === ym) receivedFen += toFen(p.amount);
    }

    // 未来的月份不预估、不统计
    if (ym <= cm) {
      const cutoff = ym === cm ? today : null;   // 当月只算到今天

      for (const room of state.rooms) {
        const ts = tenanciesOf(room.id);

        // ② 过了收租日还没确认的
        if (isRentedInMonth(ts, ym)) {
          const st = roomMonthState({
            tenancies: ts, hasPayment: false, room, ym, today, defaults,
          });
          if (st === 'overdue' && !isPaidInMonth(room, ym)) {
            unpaidCount++;
            unpaidFen += toFen(rentOfLastActiveLeaseInMonth(ts, ym) || 0);
          }
        }

        // ③ 空置少赚的 —— 不管有没有租出去，空着的天数都要算
        const lower = dateOfTimestamp(room.createdAt);
        if (!lower || lower.slice(0, 7) > ym) continue;   // 这间房那时还不存在

        let vacantDays = 0;
        for (let d = 1; d <= dim; d++) {
          const date = ym + '-' + pad2(d);
          if (cutoff && date > cutoff) break;
          if (lower > date) continue;                     // 房间还没加进 App
          if (!ts.some(t => leaseCoversDay(t, date))) vacantDays++;
        }
        if (vacantDays > 0) {
          vacantFen += vacantLossFen(referenceRent(ts, room, ym), vacantDays, dim);
        }
      }
    }

    rows.push({ ym, receivedFen, unpaidFen, unpaidCount, vacantFen });
  }

  const sum = (k) => rows.reduce((s, r) => s + r[k], 0);
  return {
    year, cm, rows,
    totalReceivedFen: sum('receivedFen'),
    totalUnpaidFen:   sum('unpaidFen'),
    totalUnpaidCount: sum('unpaidCount'),
    totalVacantFen:   sum('vacantFen'),
  };
}

               <b>这只是提醒，不算收入</b>
             </div>
             <button class="btn-line" id="sGoUnpaid">去看看是哪些</button>`
          : `<div class="stat-num gray">都收齐了</div>
             <div class="stat-note">${esc(s.year)} 年没有拖欠的租金</div>`}
      </div>

      <div class="stat-block">
        <div class="stat-label">房子空着少赚的（估算）</div>
        <div class="stat-num ${s.totalVacantFen ? 'red' : 'gray'}">${
          s.totalVacantFen ? money(s.totalVacantFen) : '没有空置'}</div>
        <div class="stat-note">
          房子空着的天数折算出来的机会成本<br>
          <b>不是支出，也不会从上面的钱里扣</b>

      </div>
