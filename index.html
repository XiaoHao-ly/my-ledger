/* ==========================================================================
   [SECTION: 备份与恢复]
   --------------------------------------------------------------------------
   数据只在这台手机里。手机丢了、清了浏览器数据，账就没了 ——
   所以备份不是"锦上添花"，是必做功能。

   三条规矩（见 CLAUDE.md 第 13 章）：
     1. 导入前必须先把当前数据自动导出一份，这一条不可跳过
     2. 备份文件带版本号和条数校验，对不上就拒绝导入，绝不"尽力导入"
     3. 绝不猜着导入 —— 猜错就是静默的数据损坏
   ========================================================================== */

const FORMAT_VERSION = 1;

/** 把数据库里的全部内容（含已删除的）打包成一份备份对象 */
async function buildBackup() {
  const [areas, rooms, tenancies, payments, meta] = await Promise.all([
    dbGetAll('areas'), dbGetAll('rooms'), dbGetAll('tenancies'),
    dbGetAll('payments'), dbGetAll('meta'),
  ]);

  const now = new Date();
  return {
    app: '房东记账',
    formatVersion: FORMAT_VERSION,
    dbVersion: DB_VERSION,
    exportedAt: now.toISOString(),
    exportedAtLocal: dateOfTimestamp(now.getTime()) + ' ' +
      pad2(now.getHours()) + ':' + pad2(now.getMinutes()),
    counts: {
      areas: areas.length, rooms: rooms.length,
      tenancies: tenancies.length, payments: payments.length,
    },
    data: { areas, rooms, tenancies, payments, meta },
  };
}

/**
 * 把内容存成文件（文字或二进制都行）。
 * 手机上优先弹"存到哪"（安卓 Chrome 132+ 支持），不行就走普通下载。
 * 返回 'saved' | 'downloaded' | 'cancelled'
 */
async function saveFile(filename, content, mime, opts) {
  const o = opts || {};
  const ext = o.ext || '.json';
  const label = o.label || '文件';

  const blob = (content instanceof Blob)
    ? content
    : new Blob([content], { type: mime + ';charset=utf-8' });

  // ① 让用户自己选存到哪个文件夹
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{ description: label, accept: { [mime]: [ext] } }],
      });
      const w = await handle.createWritable();
      await w.write(blob);
      await w.close();
      return 'saved';
    } catch (err) {
      if (err && err.name === 'AbortError') return 'cancelled';  // 用户自己点了取消
      // 其他错误 → 走下面的兜底，别让导出整个失败
      console.warn('选择保存位置失败，改用普通下载：', err);
    }
  }

  // ② 兜底：普通下载（文件会进手机的"下载"文件夹）
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  return 'downloaded';
}

/** 让用户挑一个文件 */
function pickFile(accept) {
  return new Promise((resolve) => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = accept;
    input.style.display = 'none';
    input.addEventListener('change', () => resolve(input.files && input.files[0] || null));
    input.addEventListener('cancel', () => resolve(null));
    document.body.appendChild(input);
    input.click();
    setTimeout(() => { if (input.parentNode) input.parentNode.removeChild(input); }, 60000);
  });
}

/** 检查这个备份文件能不能用。宁可拒绝，也不要猜着导入 */
function validateBackup(obj) {
  if (!obj || typeof obj !== 'object') return { ok: false, reason: '文件内容是空的。' };
  if (obj.app !== '房东记账') {
    return { ok: false, reason: '这不是「房东记账」的备份文件。<br>请选对文件再试。' };
  }
  if (typeof obj.formatVersion !== 'number') {
    return { ok: false, reason: '备份文件缺少版本信息，可能已经损坏。' };
  }
  if (obj.formatVersion > FORMAT_VERSION) {
    return { ok: false, reason:
      `这个备份来自更新版本的 App（第 ${obj.formatVersion} 版），<br>
       当前 App 是第 ${FORMAT_VERSION} 版。<br><br>
       请先把 App 更新到最新版，再恢复这个备份。` };
  }
  if (!obj.data || typeof obj.data !== 'object') {
    return { ok: false, reason: '备份文件里没有数据。' };
  }

  const counts = {};
  for (const k of ['areas', 'rooms', 'tenancies', 'payments']) {
    if (!Array.isArray(obj.data[k])) {
      return { ok: false, reason: `备份文件里的「${k}」不是列表，文件可能损坏了。` };
    }
    counts[k] = obj.data[k].length;
  }

  // 条数校验：文件里写了多少条，实际就得读到多少条
  if (obj.counts && typeof obj.counts === 'object') {
    for (const k of ['areas', 'rooms', 'tenancies', 'payments']) {
      if (typeof obj.counts[k] === 'number' && obj.counts[k] !== counts[k]) {
        return { ok: false, reason:
          `备份文件可能损坏了：<br>
           「${k}」应该 ${obj.counts[k]} 条，实际只读到 ${counts[k]} 条。<br><br>
           为避免数据错乱，已拒绝导入。` };
      }
    }
  }

  return { ok: true, counts, exportedAtLocal: obj.exportedAtLocal || '（没记录时间）' };
}

/** 导出备份。返回 true = 成功（或用户取消时返回 false） */
async function doExport({ silent = false } = {}) {
  const backup = await buildBackup();
  const text = JSON.stringify(backup, null, 2);
  const name = `房东记账备份-${dateOfTimestamp(Date.now())}.json`;

  const result = await saveFile(name, text, 'application/json',
    { ext: '.json', label: '房东记账备份文件' });
  if (result === 'cancelled') return false;

  await saveSetting('lastBackupAt', Date.now());
  if (!silent) {
    toast(`备份好了：${backup.counts.rooms} 间房、${backup.counts.payments} 条收款记录`);
  }
  return true;
}

/** 用备份里的数据整体替换掉现在的数据（一个事务，要么全成要么全不动） */
function replaceAllData(data) {
  const stores = ['areas', 'rooms', 'tenancies', 'payments', 'meta'];
  return new Promise((resolve, reject) => {
    const t = db.transaction(stores, 'readwrite');
    for (const s of stores) {
      const os = t.objectStore(s);
      os.clear();
      for (const item of (data[s] || [])) os.put(item);
    }
    t.oncomplete = () => resolve();
    t.onerror    = () => reject(t.error);
    t.onabort    = () => reject(t.error || new Error('写入被中断'));
  });
}

/** 从备份文件恢复 */
async function doImport() {
  const file = await pickFile('.json,application/json');
  if (!file) return;

  let parsed;
  try {
    parsed = JSON.parse(await file.text());
  } catch (e) {
    await confirmSheet({
      title: '这个文件打不开',
      message: '它可能不是备份文件，或者文件已经损坏。<br><br>请选之前导出的那个「房东记账备份-日期.json」。',
      okText: '知道了',
    });
    return;
  }

  const check = validateBackup(parsed);
  if (!check.ok) {
    await confirmSheet({ title: '这个文件不能用来恢复', message: check.reason, okText: '知道了' });
    return;
  }

  const yes = await confirmSheet({
    title: '从备份恢复',
    message: `备份文件里装着：<br><br>
      　${check.counts.areas} 个区域<br>
      　${check.counts.rooms} 间房<br>
      　${check.counts.tenancies} 份租约<br>
      　${check.counts.payments} 条收款记录<br><br>
      备份时间：${esc(check.exportedAtLocal)}<br><br>
      ⚠️ <b>恢复会把手机上现在的数据全部替换掉。</b><br>
      别担心，我会先自动帮你把现在的数据导出一份。`,
    okText: '继续恢复',
  });
  if (!yes) return;

  // ★ 不可跳过的一步：先把当前数据存一份，防止用户后悔
  toast('正在先把现在的数据备份一份…');
  const saved = await doExport({ silent: true });
  if (!saved) {
    await confirmSheet({
      title: '没有备份成功',
      message: '为了安全，恢复已经取消。<br><br>请允许下载文件之后再试一次。',
      okText: '知道了',
    });
    return;
  }

  try {
    await replaceAllData(parsed.data);
  } catch (err) {
    console.error(err);
    await confirmSheet({
      title: '恢复失败',
      message: '数据没有改变，请再试一次。<br><br>' + esc(String(err && err.message || err)),
      okText: '知道了',
    });
    return;
  }

  await saveSetting('lastBackupAt', Date.now());
  await loadAll();
  renderAll();

  await confirmSheet({
    title: '恢复完成',
    message: `已经恢复：<br>
      　${check.counts.rooms} 间房、${check.counts.payments} 条收款记录。<br><br>
      点确定后 App 会重新打开一次。`,
    okText: '确定',
  });
  location.reload();
}

/* --------------------------------------------------------------------------
   导出 Excel 表格
   --------------------------------------------------------------------------
   表格是「复印件」，不是「账本」：
     · 给你看、给你打印、给你发别人
     · 改表格不会影响 App 里的账
   真正的账本永远是 App 里这个。
   -------------------------------------------------------------------------- */

async function doExportExcel(years) {
  if (!state.rooms.length) { toast('还没有房间，没有表格可以导'); return; }

  toast('正在生成表格，请稍等…');
  try {
    const { zip, stats } = buildExportZip({
      areas:     state.areas,
      rooms:     state.rooms,
      tenancies: state.tenancies,
      payments:  state.payments,
      years,
      today:     todayStr(),
    });

    const name = `房东记账表格-${dateOfTimestamp(Date.now())}.zip`;
    const result = await saveFile(
      name,
      new Blob([zip], { type: 'application/zip' }),
      'application/zip',
      { ext: '.zip', label: 'Excel 表格压缩包' }
    );
    if (result === 'cancelled') return;

    toast(`导好了：${stats.files} 个文件、${stats.rows} 行数据`);
  } catch (err) {
    console.error('[导出表格] 出错：', err);
    await confirmSheet({
      title: '导出失败',
      message: '表格没有导出来。<br><br>' + esc(String(err && err.message || err)) +
        '<br><br>你的账本数据没有受到任何影响。',
      okText: '知道了',
    });
  }
}

function sheetWipeAll() {
  openSheet({
    title: '⚠️ 清空全部数据',
    showOk: false,
    bodyHtml: `
      <div class="sheet-note" style="padding-left:0;padding-right:0">

      </div>`,
  });

    btn.disabled = input.value.trim() !== '清空';

  btn.addEventListener('click', async () => {

      });

    }

    const yes = await confirmSheet({
      title: '最后确认',

      okText: '确定清空',

    if (!yes) return;

    closeSheet();
    try {
      await replaceAllData({ areas: [], rooms: [], tenancies: [], payments: [], meta: [] });

      localStorage.removeItem('lz_hadData');
      await loadAll();
      renderAll();
      toast('已清空');
    } catch (err) {
      console.error(err);
      toast('清空失败，数据没有改变');
    }
  });
}

/** 「3 天前」这种说法，比日期更好懂 */
function daysAgoText(ts) {
  const days = Math.floor((Date.now() - ts) / 86400000);
  if (days <= 0) return '今天';
  if (days === 1) return '昨天';
  return days + ' 天前';
}

      <button class="btn-line" id="btnExcel">导出 Excel 表格</button>

      <div class="section-title">默认收租日</div>
      <div class="with-unit">
        <input id="sDue" type="number" inputmode="numeric" min="1" max="31"
               value="${attr(state.settings.defaultRentDueDay)}">
        <span class="unit">号</span>
      </div>
      <div class="hint">
        没单独设置过的房间都用这个日子。<br>
        设了 31 号的话，只有 30 天的月份会自动提前到月底（2 月同理）。
      </div>

      <div class="section-title">区域</div>
      <div class="hint" style="margin-bottom:10px">
        当前有 ${state.areas.length} 个区域、${state.rooms.length} 间房。
      </div>
      <button class="btn-line" id="btnManageAreas">管理区域（改名 / 排序 / 删除）</button>

      <div class="section-title">危险操作</div>
      <button class="btn-danger" id="btnWipe">清空全部数据</button>

      <div class="hint" style="margin-top:20px;line-height:1.8;color:var(--text-dim)">
        数据全部存在这台手机的浏览器里，不会上传到任何地方。<br>
        当前进度：核心功能已完成。剩下的还有：导出 Excel 表格、细节打磨。
      </div>`,
  });

  document.getElementById('btnExport').addEventListener('click', () => doExport());
  document.getElementById('btnImport').addEventListener('click', () => { closeSheet(); doImport(); });
  document.getElementById('btnExcel').addEventListener('click', () => { closeSheet(); sheetExportExcel(); });
  document.getElementById('btnManageAreas').addEventListener('click', () => { closeSheet(); sheetManageAreas(); });
  document.getElementById('btnWipe').addEventListener('click', () => { closeSheet(); sheetWipeAll(); });

  document.getElementById('sDue').addEventListener('change', async (e) => {
    const n = Number(e.target.value);
    if (!Number.isInteger(n) || n < 1 || n > 31) {
      toast('请填 1~31 之间的整数');
      e.target.value = state.settings.defaultRentDueDay;
      return;
    }
    await saveSetting('defaultRentDueDay', n);
    renderAll();
    toast('默认收租日改成 ' + n + ' 号了');
  });
}

/* ==========================================================================
   [SECTION: 点击交互]
   ========================================================================== */

document.getElementById('tabsArea').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  if (btn.dataset.add) { sheetNewArea(); return; }
  if (btn.dataset.area === curArea) return;
  curArea = btn.dataset.area;
  curStatus = 'all';
  renderAll();
});

document.getElementById('tabsStatus').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn || btn.dataset.status === curStatus) return;
  curStatus = btn.dataset.status;
  renderStatusTabs();
  renderRooms();
});

document.getElementById('roomList').addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  if (act === 'noop') return;              // 电话号码链接，交给系统拨号
  e.stopPropagation();

  const room = el.dataset.room
    ? state.rooms.find(r => r.id === el.dataset.room)
    : null;

  if (act === 'newArea')    { sheetNewArea(); return; }
  if (act === 'newRoom')    { sheetNewRoom(); return; }
  if (act === 'batchRooms') { sheetBatchRooms(); return; }
  if (act === 'edit' && room) { sheetEditRoom(room); return; }

  if (act === 'pay' && room) {
    const ym = thisMonth();
    // 已经收过了 → 打开记录（可以撤销）；还没收 → 打开确认框
    if (isPaidInMonth(room, ym)) sheetPayHistory(room);
    else sheetCollect(room, ym);
    return;
  }
  if (act === 'rent' && room) { sheetTenancy(room, null); return; }
});

/* ---------- 搜索 ---------- */

// 顶栏的 🔍：点一下打开，再点一下收起来
document.getElementById('btnSearch').addEventListener('click', () => {
  if (searchOn) closeSearch(); else openSearch();
});

// 边打边找（不用按回车）
document.getElementById('searchInput').addEventListener('input', (e) => {
  searchQuery = e.target.value;
  renderRooms();
});

// ✕ 只清空搜索词，不关掉搜索框 —— 接着打下一个名字就行
document.getElementById('searchClear').addEventListener('click', () => {
  const inp = document.getElementById('searchInput');
  inp.value = '';
  searchQuery = '';
  renderRooms();
  inp.focus();
});

// 电脑上按 Esc 关掉（手机上用顶栏那个 🔍）
document.getElementById('searchInput').addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeSearch();
});

document.getElementById('btnStat').addEventListener('click', sheetStats);

document.getElementById('btnGear').addEventListener('click', sheetSettings);

// 刷新：用「现在」的真实时间重算一遍所有房间的状态。
// 主要是为了这种情况 —— App 一直开着没关，跨过了收租日那天的零点，
// 界面不会自己变红，得点一下这里。
document.getElementById('btnRefresh').addEventListener('click', () => {
  renderAll();
  toast('已刷新');
});

/* ==========================================================================
   [SECTION: 装到桌面]
   手机认为"这个网站可以装成 App"时，会悄悄告诉我们一声。
   我们趁机把"装到桌面"按钮显示出来，让房东一点就能装。
   ========================================================================== */
let installEvent = null;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();            // 先拦下手机自带的弹窗，我们自己决定什么时候弹
  installEvent = e;
  const btn = document.getElementById('btnInstall');
  if (btn) btn.hidden = false;
});

document.getElementById('btnInstall').addEventListener('click', async () => {
  if (!installEvent) return;
  installEvent.prompt();
  const { outcome } = await installEvent.userChoice;
  if (outcome === 'accepted') {
    document.getElementById('btnInstall').hidden = true;
    toast('装好了，去桌面找「房东记账」');
  }
  installEvent = null;
});

if (window.matchMedia('(display-mode: standalone)').matches) {
  document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('btnInstall');
    if (btn) btn.hidden = true;
  });
}

/* ==========================================================================
   [SECTION: 离线支持 + 新版本提示]
   ========================================================================== */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('./sw.js');
      reg.update();   // 每次打开都问一下有没有新版本

      // 情况一：上次打开时已经下载好新版本了，只是还没换上
      if (reg.waiting && navigator.serviceWorker.controller) showUpdateBar(reg.waiting);

      // 情况二：这次打开时正好发现新版本
      reg.addEventListener('updatefound', () => {
        const sw = reg.installing;
        if (!sw) return;
        sw.addEventListener('statechange', () => {
          if (sw.state === 'installed' && navigator.serviceWorker.controller) {
            showUpdateBar(sw);
          }
        });
      });
    } catch (err) {
      console.warn('离线功能没启用成功（不影响正常使用）:', err);
    }
  });

  // 用户点了"立即更新"，新版本接管后再刷新页面
  // 绝不自动刷新 —— 房东可能正在填房间信息，突然刷新会弄丢
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloading) return;
    reloading = true;
    location.reload();
  });
}

function showUpdateBar(worker) {
  const bar = document.getElementById('updateBar');
  const btn = document.getElementById('btnUpdate');
  if (!bar || !btn) return;

  bar.classList.add('show');
  btn.onclick = () => {
    btn.disabled = true;
    btn.textContent = '更新中…';
    worker.postMessage({ type: 'SKIP_WAITING' });
  };
}

/* ==========================================================================
   [SECTION: 启动]
   ========================================================================== */
(async function boot() {
  try {
    db = await openDB();

    // 申请"持久化存储"：防止手机在空间紧张时自动清掉你的账本。
    // 必须在房东还没积累数据时就做，晚了就来不及了。
    if (navigator.storage && navigator.storage.persist) {
      try {
        const already = await navigator.storage.persisted();
        if (!already) await navigator.storage.persist();
      } catch (e) { /* 不支持就算了，不影响使用 */ }
    }

    await loadAll();

    // 交叉哨兵：以前确实存过数据，现在却读不到了 → 数据可能被手机清掉了。
    // 必须明确告诉房东，而不是安静地给一个空白 App。
    // （标记只在"真的存过数据"时才打，而且只有主动清空才会擦掉，所以不会误报）
    const hadData = localStorage.getItem('lz_hadData') === '1';
    if (!state.areas.length && !state.rooms.length && hadData) {
      renderAll();
      const el = document.getElementById('notice');
      el.className = 'notice';
      el.style.display = '';
      el.innerHTML =
        `⚠️ <b>数据读不到了。</b><br>
         这台手机以前存过数据，但现在读出来是空的——
         可能是浏览器的数据被清理过。<br>
         如果你导出过备份，可以点右上角 ⚙ →「从备份恢复」把它找回来。`;
      return;   // 不要再往下写任何东西，免得盖掉线索
    }

    // 真的有数据才打这个标记
    if (state.areas.length || state.rooms.length) {
      localStorage.setItem('lz_hadData', '1');
    }

    // 第一次使用：记下开始用的时间（用于"该提醒备份了吗"）
    if (!state.settings.firstUseAt) {
      await saveSetting('firstUseAt', Date.now());
    }
    // 记下"统计起始月"，避免以后填了老起租日就算出一堆历史欠租
    if (!state.settings.statsStartMonth) {
      await saveSetting('statsStartMonth', currentMonth());
    }

    renderAll();
  } catch (err) {
    console.error(err);
    document.getElementById('roomList').innerHTML =
      `<div class="empty">
         <div class="big">😵</div>
         <div>打不开账本</div>
         <div style="margin-top:8px;font-size:15px">${esc(err.message || err)}</div>
       </div>`;
  }
})();
</script>
